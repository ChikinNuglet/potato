<!doctype html>
<!-- Thursday Potato storyboard frames: the level's own world (its background painter + the memory-chip floor) with the 3D
     Potato walking through it. Renders one frame per 1/FPS s and posts it to a local receiver. Scratch tool (play/_* is not published). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap">
<style>body{margin:0;background:#111;color:#9f9;font:12px monospace} #c{width:960px;height:540px;display:block} #sp{position:absolute;left:-2000px;top:0;width:320px;height:320px}</style>
<script src="./glitchwords.js"></script>
</head><body><canvas id="c" width="960" height="540"></canvas><div id="sp"></div><div id="log"></div>
<script type="module">
import { build, parseWords, meta } from '../run/levels/thursday-potato.mjs';
import { story } from '../run/levels/story-thursday-potato.mjs';
import { stamp } from '../run/story.mjs';
import { makeMusic } from './music.mjs';
import { createSpud } from './_sbspud.mjs';
import { loadOutfit } from './outfits3d.mjs';
import * as T from './vendor/three.module.js';

const W = 960, H = 540, END = 106.03, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const log = m => { document.getElementById('log').textContent = m; };
const GREEN = '#2bff88', WARM = '#ffbf73', CREAM = '#ffe6c2', GOLD = '#ffd84a', SEL = '#9bb4d6', PURPLE = '#9a52ff', INK = '#120a05';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), ease = u => { u = clamp(u); return u * u * (3 - 2 * u); }, span = (t, a, b) => t >= a && t < b;
const mix = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * clamp(k)).toString(16).padStart(2, '0')).join(''); };

// ---------- the level, built the way the game builds it (so the painter has its song + course) ----------
const map = await fetch('./' + meta.map).then(r => r.json());
const music = await fetch('./' + meta.map.replace('.map.json', '.music.json')).then(r => r.json());
const viz = await fetch('../' + meta.viz).then(r => r.ok ? r.json() : null).catch(() => null);
map.music = music; const words = parseWords(await fetch('../' + meta.words).then(r => r.text()));
build(words, map, viz); const M = makeMusic(music), BP = map.period, BO = map.offset;
const KICKS = music.kick || []; const kickEnv = t => { let l = -9; for (const k of KICKS) { if (k > t) break; l = k; } return Math.exp(-(t - l) / 0.11); };
await document.fonts.load('400 20px "Major Mono Display"');

// ---------- a stand-in for a clean run (what lights his name, fills the cards, relights the stairs) ----------
const EV = [], LINE0 = [...new Set(words.filter(w => w.t0 != null).map(w => w.line))].map(l => Math.min(...words.filter(w => w.line === l && w.t0 != null).map(w => w.t0)));
for (const t0 of LINE0) if (t0 < 38.1) EV.push({ k: 'spark', t: t0 + 0.5 }, { k: 'spark', t: t0 + 1.2 }, { k: 'clear', t: t0 + 1.8 });
for (const t of [51.8, 52.6, 53.4, 54.2]) EV.push({ k: 'spark', t });
for (const h of [75.07, 75.70, 76.37, 77.01]) EV.push({ k: 'clear', what: 'up', tw: h, t: h });
const GLITCH = [4.4, 15.01, 20.94, 41.15, 47.04, 49.59, 80.22, 80.62, 88.74, 91.34];
const sAt = t => { let g = null; for (const x of GLITCH) if (x <= t) g = x; return { x: 0, y: 0, used: 0, glitchAt: g, thJ: null, t, sc: { name: 1, ev: EV.filter(e => e.t <= t), cue: [{ g: 'PERFECT', t: 10.46 }, { g: 'PERFECT', t: 80.22 }], from: 0 } }; };

// ---------- the walk: speed (px/s of ground), floor heights, hops ----------
const SPEED = [[0, 0], [4.4, 55], [9.9, 0], [10.46, 130], [31.59, 25], [32.32, 130], [38.25, 25], [42.97, 170], [50.3, 110], [60.75, 150], [72.0, 90],
  [75.07, 120], [77.01, 30], [84.71, 170], [92.65, 120], [94.66, 0]];
const spd = t => { let v = 0; for (const [a, s] of SPEED) if (t >= a) v = s; return v; };
const DT = 1 / 240, XT = []; { let x = 0; for (let t = 0; t <= END + 1; t += DT) { XT.push(x); x += spd(t) * DT; } }
const Xat = t => XT[Math.max(0, Math.min(XT.length - 1, Math.round(t / DT)))];
const tOfX = X => { let lo = 0, hi = XT.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (XT[m] < X) lo = m + 1; else hi = m; } return lo * DT; };
// segments by the time he's over them: [t0, kind, height, appearAt, label]
const SEG = [[0, 'wire', 0], [10.46, 'mem', 0, 10.46], [28.08, 'mem', 45, 0, 'THU'], [42.97, 'mem', 95], [50.3, 'mem', 0], [62.65, 'files', 60, 0, 'stage'],
  [75.07, 'files', 100, 75.07, 'file'], [75.70, 'files', 140, 75.70, 'file'], [76.37, 'files', 180, 76.37, 'file'], [77.01, 'files', 220, 77.01, 'stage'], [84.71, 'mem', 0]];
const segAt = t => { let s = SEG[0]; for (const g of SEG) if (t >= g[0]) s = g; return s; };
const hAt = t => segAt(t)[2];
// hops: at each height change he jumps (up or down), the arc ends on the change
const HOPS = SEG.slice(1).filter((g, i) => g[2] !== SEG[i][2] && g[0] !== 42.97 && g[0] !== 84.71).map(g => g[0]);
const LIFTS = [[42.34, 42.97], [84.06, 84.71]];
function potZ(t) {   // his feet, in world px above 0
  let z = hAt(t);
  for (const tc of HOPS) { const a = tc - 0.32, b = tc + 0.06; if (t >= a && t < b) { const u = (t - a) / (b - a), h0 = hAt(a), h1 = hAt(b); z = h0 + (h1 - h0) * u + 70 * Math.sin(Math.PI * u); } }
  for (const [a, b] of LIFTS) if (t >= a && t < b) { const u = (t - a) / (b - a), h0 = hAt(a - 0.01), h1 = hAt(b + 0.01); z = h0 + (h1 - h0) * ease(u) + 120 * Math.sin(Math.PI * Math.min(1, u) ** 0.6); }
  return z;
}
const FY0 = 410; let camH = 0;   // the camera follows his floor, slowly
const yOf = h => FY0 - (h - camH) * 0.8;

// ---------- the floor's faces: the game's own textures (view.mjs: 'memory', 'files') ----------
const R = (a, b) => { let x = (a * 374761393 + b * 668265263) | 0; x = (x ^ (x >>> 13)) * 1274126177 | 0; return ((x ^ (x >>> 16)) >>> 0) / 4294967295; };
function tile(kind) { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  if (kind === 'memory') { x.fillStyle = '#03100a'; x.fillRect(0, 0, 256, 256);
    for (let r = 0; r < 2; r++) for (let k = 0; k < 2; k++) { const X = k * 128 + 10, Y = r * 128 + 22; x.fillStyle = '#0a2416'; x.fillRect(X - 6, Y - 14, 120, 112);
      x.fillStyle = '#0d0a08'; x.fillRect(X + 6, Y + 8, 96, 62); x.strokeStyle = '#120a05'; x.lineWidth = 5; x.strokeRect(X + 6, Y + 8, 96, 62);
      x.fillStyle = '#1d3a28'; x.fillRect(X + 10, Y + 12, 88, 10);
      for (let i = 0; i < 8; i++) { x.fillStyle = R(r * 8 + i, k) < 0.25 ? '#2bff88' : '#2c5a3e'; x.fillRect(X + 10 + i * 12, Y + 72, 6, 12); x.fillRect(X + 10 + i * 12, Y - 6, 6, 12); }
      x.fillStyle = '#2c5a3e'; x.font = '700 15px ui-monospace, monospace'; x.fillText(['THU', '404', 'tok', '0x1F'][r * 2 + k], X + 34, Y + 50); } }
  else { x.fillStyle = '#04120a'; x.fillRect(0, 0, 256, 256);
    for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) { const X = k * 64 + 8, Y = r * 64 + 10; x.fillStyle = '#1e7a46'; x.fillRect(X, Y + 8, 48, 40); x.fillRect(X, Y + 2, 20, 8); x.strokeStyle = '#2bff88'; x.lineWidth = 2; x.strokeRect(X, Y + 8, 48, 40);
      x.fillStyle = '#9dffc6'; x.font = '12px ui-monospace, monospace'; x.fillText(R(r, k) < 0.5 ? '404' : '0101', X + 6, Y + 34); } }
  return c; }
const TILE = { mem: tile('memory'), files: tile('files') };
const PAT = {}; for (const k in TILE) PAT[k] = ctx.createPattern(TILE[k], 'repeat');

function drawFloor(t, edgeCol, alpha = 1) {
  const Xn = Xat(t), px = PX;
  // what's on screen: walk the segments by world x
  for (let i = 0; i < SEG.length; i++) {
    let g = SEG[i]; const g2 = SEG[i + 1], kind0 = g[1], x0 = px + Xat(g[0]) - Xn, x1 = g2 ? px + Xat(g2[0]) - Xn : W + 50;
    if (x1 < -10 || x0 > W + 10 || x1 - x0 < 0.5) continue;
    if (kind0 === 'wire' && t >= 10.46) g = [0, 'mem', 0, 10.46];
    const [, kind, h, appear = 0, label] = g; const top = yOf(h);
    if (kind === 'wire') { const k = kickEnv(t); ctx.save(); ctx.globalAlpha = alpha * (t < 4.4 ? clamp((t - 3.2) / 1.2) : 1); ctx.shadowColor = GREEN; ctx.shadowBlur = 14 + 10 * k;
      ctx.strokeStyle = GREEN; ctx.lineWidth = 3 + 2 * k; ctx.beginPath(); ctx.moveTo(Math.max(0, x0), top); ctx.lineTo(Math.min(W, x1), top); ctx.stroke(); ctx.restore(); continue; }
    let a = alpha, rise = 0;
    if (appear && t < appear) {   // not solid yet: a dashed ghost of it (stairs) / nothing (the floor before LOADED)
      if (appear === 10.46) continue;
      ctx.save(); ctx.globalAlpha = 0.5 * alpha; ctx.setLineDash([8, 6]); ctx.strokeStyle = SEL; ctx.lineWidth = 2; ctx.strokeRect(x0 + 2, top, x1 - x0 - 4, 40); ctx.restore(); continue; }
    if (appear === 10.46) rise = (1 - ease((t - 10.46) / 0.18)) * 160;
    if (g[0] === 62.65 && t > 75.14) a *= 1 - clamp((t - 75.14) / 0.5);   // the selection takes the stage floor
    if (a <= 0.01) continue;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(0, rise);
    ctx.fillStyle = PAT[kind === 'files' ? 'files' : 'mem']; ctx.save(); ctx.translate(-(Xn % 256) * 0.5, top); ctx.scale(0.5, 0.5); ctx.fillRect((x0 + (Xn % 256) * 0.5) * 2, 0, (x1 - x0) * 2, (H - top + 200) * 2); ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x0, top, x1 - x0, H - top);
    ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.strokeRect(x0, top, x1 - x0, H - top + 20);
    ctx.shadowColor = edgeCol; ctx.shadowBlur = 10; ctx.strokeStyle = edgeCol; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0 + 3, top + 2); ctx.lineTo(x1 - 3, top + 2); ctx.stroke(); ctx.shadowBlur = 0;
    if (label && x1 - x0 > 60) { ctx.font = '400 18px "Major Mono Display"'; ctx.fillStyle = mix(edgeCol, '#000000', 0.3); ctx.textAlign = 'center'; ctx.fillText(label.toLowerCase(), (Math.max(x0, 0) + Math.min(x1, W)) / 2, top + 30); }
    ctx.restore();
  }
}

// ---------- Potato: the game's 3D model, rendered off-screen and drawn in ----------
const host = document.getElementById('sp'); const spud = await createSpud(host, { still: true });
const sim = await loadOutfit('simulation');
const faceTex = {}; async function face(n) { if (faceTex[n]) return faceTex[n];
  const img = new Image(); img.src = n === 'canon' ? './face-canon.png' : `./faces/face-${n}.png`; await img.decode();
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0);
  const tx = new T.CanvasTexture(c); tx.colorSpace = T.NoColorSpace; return faceTex[n] = tx; }
for (const n of ['canon', 'sleepy', 'oh', 'awe', 'deadpan', 'smirk', 'joy', 'grin', 'proud', 'determined', 'question', 'skeptical', 'focused']) await face(n).catch(() => null);
let skin = null; const wearSkin = k => { if (skin === k) return; skin = k; spud.wear(k === 'bin' ? sim : null); };
let curFace = null; const setFace = n => { if (curFace === n || !faceTex[n]) return; curFace = n; spud.setFace(faceTex[n]); };
const pcv = host.querySelector('canvas');
// his size + where his feet are in the off-screen render
spud.snap(0.5); spud.waddle(false); spud.step(0, 1 / 60);
let FOOT = 0.69, PH = 128, PX = 300; {
  const c = document.createElement('canvas'); c.width = pcv.width; c.height = pcv.height; const x = c.getContext('2d'); x.drawImage(pcv, 0, 0); const d = x.getImageData(0, 0, c.width, c.height).data;
  let top = c.height, bot = 0; for (let y = 0; y < c.height; y++) for (let X = 0; X < c.width; X += 2) if (d[(y * c.width + X) * 4 + 3] > 40) { top = Math.min(top, y); bot = Math.max(bot, y); }
  FOOT = bot / c.height; window.__bbox = [top, bot, c.width, c.height]; PH = 130 / ((bot - top) / c.height); }   // PH = draw size of the whole off-screen square

// what he does, by time
const VAN = [[47.0, 47.28], [88.74, 89.04]], BLACKOUTS = [[46.34, 46.8], [88.06, 88.5]];
const FACES = [[0, 'sleepy'], [20.94, 'canon'], [24.0, 'canon'], [31.59, 'deadpan'], [32.32, 'smirk'], [38.25, 'awe'], [41.5, 'joy'], [44.0, 'grin'], [46.59, 'oh'], [47.28, 'smirk'], [48.66, 'joy'],
  [51.1, 'canon'], [56.02, 'proud'], [60.75, 'determined'], [62.65, 'grin'], [69.18, 'proud'], [72.0, 'question'], [75.07, 'focused'], [79.6, 'determined'], [80.62, 'smirk'], [83.51, 'joy'],
  [87.16, 'grin'], [88.11, 'oh'], [89.04, 'smirk'], [90.42, 'joy'], [92.65, 'proud'], [94.66, 'awe'], [99.16, 'joy'], [101.05, 'canon'], [104.41, 'canon']];
const faceAt = t => { let f = 'canon'; for (const [a, n] of FACES) if (t >= a) f = n; return f; };
const YAW = [[0, 0.5], [94.66, 0.0], [95.4, -0.6], [96.3, 0.6], [97.2, 0.0], [99.16, 0.3], [101.05, 0.5], [104.41, 1.15]];
const yawAt = t => { let y = 0.5; for (const [a, v] of YAW) if (t >= a) y = v; return y; };
let simT = 0;
function renderPotato(t, binWipe = null) {
  const walking = spd(t) >= 40 && t >= 4.4 && t < 94.66;
  spud.waddle(walking); spud.turnTo(yawAt(t)); setFace(faceAt(t));
  const purple = GLITCH.some(g => t >= g && t < g + 0.18) || span(t, 80.62, 80.62 + BP) ? 1 : 0; spud.glitch(purple);
  // the dance after the slam: a bounce on every beat
  wearSkin(t < 41.15 ? 'bin' : 'bare');
  const steps = 5; for (let k = 0; k < steps; k++) { simT += 1 / 60; spud.step(simT, 1 / 60); }
  if (binWipe != null) {   // his skin floods in top to bottom: bare above the line, binary below
    const a = document.createElement('canvas'); a.width = pcv.width; a.height = pcv.height; const ax = a.getContext('2d');
    wearSkin('bare'); spud.step(simT, 1 / 600); ax.drawImage(pcv, 0, 0);
    wearSkin('bin'); spud.step(simT, 1 / 600); const b = document.createElement('canvas'); b.width = a.width; b.height = a.height; b.getContext('2d').drawImage(pcv, 0, 0);
    const cut = a.height * (0.25 + 0.5 * binWipe); ax.drawImage(b, 0, cut, a.width, a.height - cut, 0, cut, a.width, a.height - cut);
    ax.fillStyle = '#ffffff'; ax.globalCompositeOperation = 'source-atop'; ax.fillRect(0, cut - 2, a.width, 4); return a; }
  return pcv;
}

// ---------- lights ----------
function glow(x, y, r, col, a) { if (a <= 0.004) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore(); }
const moodCol = t => t < 41.15 ? GREEN : t < 56.02 ? mix(GREEN, CREAM, 0.6) : t < 72 ? WARM : t < 80.62 ? SEL : t < 99.16 ? WARM : GOLD;

// ---------- the outro: his kitchen, then the 404 around it, then the door ----------
const KIT = {}; for (const n of ['02-floor', '04-cabinets', '06-fridge', '08-chairs', '09-lamp', '10-lit']) { const i = new Image(); i.src = `./_sbk/kitchen-${n}.png`; await i.decode(); KIT[n] = i; }
const KSTEP = [[94.66, '02-floor'], [95.87, '04-cabinets'], [97.20, '06-fridge'], [98.10, '08-chairs'], [98.36, '09-lamp'], [99.16, '10-lit']];
const PULL = [[99.81, 0.7], [101.05, 0.48], [102.33, 0.32]];
const pullK = t => { let s = 1, from = 1; for (const [a, v] of PULL) { if (t >= a) { from = s; s = v; const u = ease((t - a) / 0.3); if (u < 1) return from + (v - from) * u; } } return s; };
const VOID = document.createElement('canvas'); VOID.width = W; VOID.height = H; { const v = VOID.getContext('2d'); v.fillStyle = '#020403'; v.fillRect(0, 0, W, H);
  v.globalAlpha = 0.22; v.fillStyle = v.createPattern(TILE.mem, 'repeat'); v.save(); v.scale(0.4, 0.4); v.fillRect(0, 0, W / 0.4, H / 0.4); v.restore(); }
function door(t, cx, fy, sc) {   // the level's door (story-thursday-potato.mjs door()), drawn in the void
  const PART = 103.09, DOOR = 104.1; if (t < PART) return; const seam = ease((t - PART) / 0.4), open = t >= DOOR ? ease((t - DOOR) / 0.5) : 0, kk = kickEnv(t);
  const pulse = [103.41, 103.64, 103.83].filter(a => t >= a).length / 3;
  const DW = 100 * sc, h = 230 * sc * seam, x0 = cx - DW / 2, x1 = cx + DW / 2, top = fy - h;
  glow(cx, fy - h / 2, (140 + 140 * open + 120 * pulse) * sc + 70 * kk * open, CREAM, 0.3 + 0.3 * pulse + 0.4 * open);
  ctx.save(); ctx.fillStyle = '#fff8ea'; ctx.shadowColor = CREAM; ctx.shadowBlur = 30 + 30 * kk; ctx.fillRect(x0, top, DW, h); ctx.restore();
  const sw = Math.cos(open * Math.PI * 0.46), px = x0 + DW * sw, bulge = 22 * sc * Math.sin(open * Math.PI * 0.46);
  ctx.save(); ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(px - (open > 0 ? 2 * bulge : 0), top - bulge); ctx.lineTo(px - (open > 0 ? 2 * bulge : 0), fy + bulge * 0.4); ctx.lineTo(x0, fy); ctx.closePath();
  ctx.fillStyle = '#2a1a0a'; ctx.fill(); ctx.lineWidth = 6 * sc; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.lineWidth = 12 * sc; ctx.strokeStyle = '#ffffff'; ctx.strokeRect(x0 - 6 * sc, top - 6 * sc, DW + 12 * sc, h + 6 * sc); ctx.lineWidth = 7 * sc; ctx.strokeStyle = INK; ctx.strokeRect(x0 - 6 * sc, top - 6 * sc, DW + 12 * sc, h + 6 * sc); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (0.12 + 0.2 * pulse + 0.3 * open); ctx.fillStyle = CREAM; ctx.beginPath(); ctx.moveTo(x0, fy); ctx.lineTo(x1, fy); ctx.lineTo(x1 + 200 * sc, H); ctx.lineTo(x0 - 200 * sc, H); ctx.fill(); ctx.restore();
}

// ---------- one frame ----------
const SCR = document.createElement('canvas'); SCR.width = W; SCR.height = H; const sx = SCR.getContext('2d');
function frame(t) {
  camH += (hAt(t) - camH) * 0.18;
  const z = potZ(t), feetY = yOf(z), px = PX, py = feetY - 67, s = sAt(t);
  const inKitchen = t >= 94.66;
  // 1) the level's background (its own painter, untouched)
  ctx.save(); ctx.clearRect(0, 0, W, H);
  story(ctx, { t, s, music: M, W, H, P: BP, b: (t - BO) / BP, px, py, line: -1, lineT0: 0, used: 0, dt: 1 / 12, floorY: yOf(hAt(t)) });
  ctx.restore();
  // 2) lights behind him
  const k = kickEnv(t), dark = BLACKOUTS.some(([a, b]) => span(t, a, b)) || span(t, 98.7, 99.16);
  if (t >= 4.4 && !dark) glow(px, py + 10, 120 + 40 * k, moodCol(t), (t < 10.46 ? 0.25 : 0.32) + 0.25 * k);
  if (span(t, 62.65, 72.0)) { const u = ease((t - 62.65) / 0.25); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.22 * u * (1 - clamp((t - 71.6) / 0.4));
    const g = ctx.createLinearGradient(0, 0, 0, feetY); g.addColorStop(0, '#fff3d8'); g.addColorStop(1, 'rgba(255,230,190,0.6)'); ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(px - 30, 0); ctx.lineTo(px + 30, 0); ctx.lineTo(px + 110, feetY + 6); ctx.lineTo(px - 110, feetY + 6); ctx.fill(); ctx.restore(); }
  // 3) the floor
  if (!inKitchen) drawFloor(t, t < 56.02 ? GREEN : span(t, 72, 83.51) ? SEL : WARM, dark ? 0.3 : 1);
  // 4) him
  const hidden = t < 4.4 || VAN.some(([a, b]) => span(t, a, b));
  let pimg = null; if (!hidden || inKitchen) pimg = renderPotato(t, span(t, 41.15, 41.5) ? (t - 41.15) / 0.35 : null);
  const drawPot = (g, X, Y, size) => { if (!pimg || hidden) return; const S = size; g.save();
    if (span(t, 31.59, 32.32) && Math.floor(t * 12) % 3 !== 2) g.filter = 'grayscale(1) brightness(1.15) contrast(0.8)';   // the labels try to load onto him and stall
    if (dark) g.globalAlpha = 0.55;
    if (span(t, 4.4, 4.62)) { g.globalAlpha = 0.6; g.drawImage(pimg, X - S / 2 + 10, Y - S * FOOT, S, S); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
    let bounce = 0; if (t >= 99.16 && t < 104.41) { const b = (t - BO) / BP; bounce = 14 * Math.abs(Math.sin(Math.PI * b)); }
    g.drawImage(pimg, X - S / 2, Y - S * FOOT - bounce, S, S); g.restore(); };
  if (!inKitchen) drawPot(ctx, px, feetY, PH);
  // 5) LOAD COMPLETE (the level's stamp)
  if (span(t, 92.65, 95.75)) stamp(ctx, 'LOAD COMPLETE', W * 0.64, H * 0.56, Math.min(1, (t - 92.65) * 3), t >= 93 ? CREAM : '#ffffff', -0.06, 48);
  // 6) the outro: his kitchen builds round him, black, the slam, the pull-back into the 404, the door
  if (inKitchen) {
    sx.clearRect(0, 0, W, H); let kn = null; for (const [a, n] of KSTEP) if (t >= a) kn = n;
    const kin = ease((t - 94.66) / 0.3);
    if (t < 99.16) { sx.globalAlpha = 1; sx.drawImage(cv, 0, 0); sx.globalAlpha = kin; }   // the level fades behind the first pieces
    const KH = H * 1.12, KW = KH * 16 / 9; sx.drawImage(KIT[kn], (W - KW) / 2, H - KH + (H * 0.86 - 410) * 0 - 30, KW, KH); sx.globalAlpha = 1;
    if (span(t, 98.7, 99.16)) { sx.fillStyle = '#000'; sx.fillRect(0, 0, W, H); }
    for (const [a] of KSTEP) if (span(t, a, a + 0.25)) { sx.save(); sx.globalCompositeOperation = 'lighter'; sx.globalAlpha = 0.3 * (1 - (t - a) / 0.25); sx.fillStyle = a === 99.16 ? GOLD : CREAM; sx.fillRect(0, 0, W, H); sx.restore(); }
    if (t >= 99.16 && t < 99.8) { const g = sx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 700); g.addColorStop(0, GOLD); g.addColorStop(1, 'rgba(0,0,0,0)'); sx.save(); sx.globalCompositeOperation = 'lighter'; sx.globalAlpha = 0.6 * (1 - (t - 99.16) / 0.64); sx.fillStyle = g; sx.fillRect(0, 0, W, H); sx.restore(); }
    drawPot(sx, W * 0.42, 452, PH * 1.25);
    // the pull-back: the lit kitchen is one small room in the 404
    const p = pullK(t), cx = W * 0.42, cy = H * 0.62;
    ctx.save(); ctx.drawImage(VOID, 0, 0); ctx.restore();
    if (p < 1) { ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = mix('#1a0f2e', '#000000', 0.2); ctx.font = '400 26px "Major Mono Display"'; ctx.textAlign = 'center';
      for (let i = 0; i < 26; i++) { ctx.fillStyle = i % 3 ? '#2a0f63' : '#5a3a9a'; ctx.fillText(i % 4 ? '404' : 'not found', R(i, 21) * W, 30 + R(i, 22) * (H - 40)); } ctx.restore(); }
    const ww = W * p, hh = H * p, x0 = cx - (cx) * p, y0 = cy - cy * p;
    if (p < 1) { glow(x0 + ww / 2, y0 + hh / 2, ww * 0.9, WARM, 0.35); ctx.fillStyle = '#ffffff'; ctx.fillRect(x0 - 5, y0 - 5, ww + 10, hh + 10); ctx.fillStyle = INK; ctx.fillRect(x0 - 3, y0 - 3, ww + 6, hh + 6); }
    ctx.drawImage(SCR, x0, y0, ww, hh);
    if (t >= 103.09) door(t, W * 0.84, H * 0.8, 0.85);
    // the last hit: close on his face, side-eye toward the door's light
    if (t >= 104.41) { ctx.drawImage(VOID, 0, 0); glow(W * 0.95, H * 0.5, 520, CREAM, 0.55); renderPotato(t); ctx.drawImage(pcv, W * 0.5 - 330, H * 0.5 - 360, 660, 660);
      if (t > END - 0.5) { ctx.fillStyle = `rgba(0,0,0,${clamp((t - END + 0.5) / 0.45)})`; ctx.fillRect(0, 0, W, H); } }
  }
}

// ---------- drive ----------
const post = (port, name, url) => fetch(`http://localhost:${port}/save?name=${name}`, { method: 'POST', body: url });
window.SB = {
  frame, PX,
  async stills(ts, port = 8798, prefix = 'sb') { for (const t of ts) { camH = hAt(t); simT = t; for (let k = 0; k < 20; k++) renderPotato(t); frame(t); await post(port, `${prefix}-${t.toFixed(2)}`, cv.toDataURL('image/jpeg', 0.85)); } return 'ok'; },
  async all(fps = 12, from = 0, to = END, q = 0.66) { camH = 0; simT = 0; const n0 = Math.round(from * fps), n1 = Math.round(to * fps);
    for (let i = n0; i < n1; i++) { const t = i / fps; frame(t); await post(8795, `f${String(i).padStart(5, '0')}.jpg`, cv.toDataURL('image/jpeg', q)); if (i % 24 === 0) log(`frame ${i} / ${n1}`); } return 'done ' + (n1 - n0); },
};
window.__ready = true; log('ready');
</script></body></html>
