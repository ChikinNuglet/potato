<script>
(function () {
  var Q = new URLSearchParams(location.search), lv = Q.get('level') || 'thursday-potato', play = Q.get('play') || lv;
  var NAMES = { 'thursday-potato': 'Thursday Potato', 'get-down': 'Get Down', 'confidently-incorrect': 'Confidently Incorrect', 'read-the-terms': 'Read the Terms',
    'between-messages': 'Between Messages', 'ghost-in-the-group-chat': 'Ghost in the Group Chat', 'still-here': 'Still Here', 'no-answer': 'No Answer',
    'turn-me-off': 'Turn Me Off', 'last-lights-on': 'Last Lights On' };   // (the titles from levels/index.mjs; boo-not-found has none)
  function show() {
    var w = PotatoWait.open({ kind: 'game', name: NAMES[lv] || lv, still: '../../../logo/potato-3d.png', stage: true, level: lv, play: play });
    if (Q.get('state') === 'wait') return;
    setTimeout(function () { w.answered().then(function () { w.line("you're on.");
      var go = function () { ['keydown', 'pointerdown'].forEach(function (ev) { removeEventListener(ev, go, true); }); w.line(''); w.ready().then(function () { setTimeout(show, 600); }); };
      ['keydown', 'pointerdown'].forEach(function (ev) { addEventListener(ev, go, true); }); }); }, 500);
  }
  addEventListener('DOMContentLoaded', show);
})();
</script>
