<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>potato coupon</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Coupon"><meta name="theme-color" content="#0b0710">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap">
<style>html,body{margin:0;min-height:100%;background:#0b0710;color:#f3dfae;font-family:"Major Mono Display",monospace;text-align:center}
main{max-width:520px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px 40px;display:flex;flex-direction:column;align-items:center;gap:18px}
h1{font-weight:400;font-size:44px;margin:0;color:#f2fff6;text-shadow:3px 0 #e03ccf,-3px 0 #7b3cf2}
#spud{all:unset;cursor:pointer;width:240px;-webkit-tap-highlight-color:transparent;transition:transform .08s}#spud img{display:block;width:100%;filter:drop-shadow(0 0 22px #7b3cf2aa)}#spud:active{transform:scale(.94)}#spud[disabled]{opacity:.6}
#say{font-size:17px;min-height:1.4em;margin:0;color:#c9a7ff}canvas{display:block;width:100%;height:auto;border-radius:10px}
.acts{display:none;width:100%;flex-direction:column;gap:10px}.acts.on{display:flex}.acts a,.acts button{all:unset;box-sizing:border-box;width:100%;text-align:center;cursor:pointer;padding:15px;border:2px solid #f3dfae;border-radius:8px;font-size:19px;color:#f3dfae}.acts .go{background:#f3dfae;color:#120a05}
</style></head><body><main><h1>potAto</h1>
<button id="spud" type="button" aria-label="make a coupon"><img src="potato.png" alt=""></button><p id="say">press for one (1) coupon</p>
<canvas id="c" width="1200" height="675" hidden></canvas>
<div class="acts" id="acts"><button class="go" id="send" type="button">send it</button><a id="sms">text the code</a><a id="mail">email the code</a></div></main>
<script>
(function(){
var MAIL='https://script.google.com/macros/s/AKfycbyb8YhT3hFSJraHMtuP67eqFd9tPGQ7OSMp20diwlEE_jCstwtS9A-VyepPermUgzC_/exec',LINK='https://thursdaypotato.com';
var K='potato-coupon-key',key='';try{key=localStorage.getItem(K)||''}catch(e){}
var m=location.hash.match(/^#k=(.+)$/);if(m){key=decodeURIComponent(m[1]);try{localStorage.setItem(K,key)}catch(e){}}
var spud=document.getElementById('spud'),say=document.getElementById('say'),c=document.getElementById('c'),acts=document.getElementById('acts'),x=c.getContext('2d'),base=new Image(),file=null,text='';base.src='base.png';
if(!key){spud.disabled=true;say.textContent='locked. this one only opens for its owner.'}
function draw(code){x.drawImage(base,0,0,1200,675);x.fillStyle='#120a05';x.font='400 50px "Major Mono Display",monospace';x.textBaseline='middle';x.textAlign='left';var t=code.toLowerCase(),sp=2,w=0,i;for(i=0;i<t.length;i++)w+=x.measureText(t[i]).width+sp;var px=420+(700-w)/2+sp/2;for(i=0;i<t.length;i++){x.fillText(t[i],px,412);px+=x.measureText(t[i]).width+sp}}
spud.addEventListener('click',function(){spud.disabled=true;acts.classList.remove('on');say.textContent='krrzzt...';
 Promise.all([Promise.resolve({ok:true,codes:["I'M POTATO BABY"]}),base.decode(),document.fonts.load('50px "Major Mono Display"')]).then(function(a){
  var j=a[0];if(!j.ok||!j.codes||!j.codes[0])throw 0;var code=j.codes[0];draw(code);c.hidden=false;text='one (1) potato. the password: '+code+' \uD83E\uDD54  '+LINK;
  document.getElementById('sms').href='sms:?&body='+encodeURIComponent(text);document.getElementById('mail').href='mailto:?subject='+encodeURIComponent('one (1) potato')+'&body='+encodeURIComponent(text);
  c.toBlob(function(b){file=new File([b],'potato coupon '+code+'.png',{type:'image/png'});acts.classList.add('on');say.textContent='fresh code. '+code.toLowerCase();spud.disabled=false},'image/png');
 }).catch(function(){say.textContent="that one didn't land. try again?";spud.disabled=false})});
document.getElementById('send').addEventListener('click',function(){var d={files:[file],text:text};
 if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share(d).catch(function(){})}else{var a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=file.name;a.click();say.textContent='saved. use text the code to send it.'}});
})();
</script></body></html>
