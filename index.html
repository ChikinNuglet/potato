  // home: walk to an O on his name and glitch in

// the spaceship way: his tiny ship from the old shooter level. Takes off, swoops across the page, then dives into an O
function shipUp(){if(busyBit)return;busyBit=true;hid=true;swapOut();glitch(220);P.classList.add('zap');

  var h=H[Math.floor(Math.random()*H.length)],r=h.getBoundingClientRect(),tx=r.left+r.width/2+scrollX,ty=r.top+r.height*.7+scrollY,x0=X,y0=Y,t0=performance.now(),dur=4200,px0=X,py0=Y;

function below(y,x){var L=plats().filter(function(pl){return pl.y>y+20&&!pl.tape}).sort(function(a,b){return a.y-b.y});for(var i=0;i<L.length;i++){if(!L[i].floor)return L[i]}return L[L.length-1]}

 if(on){VX=dir*95;X+=VX*dt;wt+=dt;thinkT-=dt;
