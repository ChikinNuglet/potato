const lastShot = t => { let l = null; for (const s of SHOTS) { if (s.t > t) break; l = s; } return l; };
function drawShots(g, t, P0) {
  for (const s of SHOTS) { const a = t - s.t; if (a < 0) break; if (a > 0.22) continue; const P = shipPos(s.B, s.t), tx = P.x + (R(s.i, 1) - 0.6) * 220 * P.s, ty = P.y + (R(s.i, 2) - 0.5) * 120 * P.s;

}

    disc(115, '#ffd23d'); g.fillStyle = INK; g.beginPath(); g.arc(-35, -15, 9, 0, 7); g.arc(35, -15, 9, 0, 7); g.fill(); g.beginPath(); g.arc(0, 20, 40, 0.2, Math.PI - 0.2); g.lineWidth = 7; g.stroke(); }

function drawFall(g, B, t) {   // the cut-in: the piece drops through the set and lands with a cardboard thud
  const a = t - B.fallAt; if (a < -0.15 || a > 1.15) return false;

// Kevin and his cage

const PLY = document.createElement('canvas'); PLY.width = W; PLY.height = H * 0.4; { const p = PLY.getContext('2d'); p.fillStyle = '#b08a5a'; p.fillRect(0, 0, W, PLY.height);

  const [a, b, push] = R0, pin = push ? ease((t - (b - 0.45)) / 0.45) : 0, pout = a > 0 && R0 !== ROOMS[ROOMS.length - 1] ? 1 - ease((t - a) / 0.45) : 0, z = Math.max(pin, pout);
  const sc = 1 + (W / SCR.w - 1) * z, cx = SCR.x + SCR.w / 2, cy = SCR.y + SCR.h / 2;
  o.save(); o.translate(W / 2, H / 2); o.scale(sc, sc); o.translate(-(cx + (W / 2 - cx) * (1 - z)), -(cy + (H / 2 - cy) * (1 - z))); room(o, t, SHOW); o.restore();
  if (t >= 243.5) o.fillStyle = `rgba(0,0,0,${clamp((t - 245.6) / 0.8)})`, o.fillRect(0, 0, W, H);
  lyric(o, t);
}
