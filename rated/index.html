html,body{background:transparent}body{margin:0;display:flex;gap:18px;padding:12px;align-items:stretch;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;color:#000}
.box{width:150px;border:5px solid #000;background:#fff;display:flex;flex-direction:column}
.top{border-bottom:5px solid #000;padding:6px 0 0;text-align:center}
.top .small{font:900 13px/1 "Arial Black",Arial,sans-serif;letter-spacing:.06em}
.P{font:900 150px/1 "Arial Black",Arial,sans-serif;letter-spacing:-.04em;margin:-8px 0 -14px}
.band{background:#000;color:#fff;text-align:center;font:900 22px/1 "Arial Black",Arial,sans-serif;letter-spacing:.04em;padding:9px 0 8px}
.by{text-align:center;font:700 9px/1.25 Arial,sans-serif;letter-spacing:.08em;padding:6px 4px}
.by sup{font-size:6px;letter-spacing:0}
.desc{width:260px;background:#fff;border:5px solid #000;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font:700 17px/1.25 Arial,sans-serif}
.win{position:relative;flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.reel{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;gap:6px}
.reel div{white-space:nowrap}
.reel .g{font:400 17px/1.25 "Major Mono Display",monospace;color:#9a52ff;text-shadow:2px 0 #e03ccf,-2px 0 #2a0f63}
.desc.shake{transform:translate(3px,-1px)}.desc.shake .reel{filter:drop-shadow(3px 0 #e03ccf) drop-shadow(-3px 0 #2a0f63)}
.desc.shake2{transform:translate(-4px,1px)}
.top{position:relative}
.spud{position:absolute;left:50%;top:26px;width:118px;transform:translateX(-50%);display:none;filter:drop-shadow(4px 0 #e03ccf) drop-shadow(-4px 0 #2a0f63)}
.top.isp .P{visibility:hidden}.top.isp .spud{display:block}.top.isp2 .spud{display:block;transform:translateX(-46%) skewX(-6deg)}.top.isp2 .P{visibility:hidden}
/* whole-logo glitch: box jumps and splits, borders flash his purple, bars tear sideways, words break into his spelling */
.box.gl{transform:translate(-4px,2px);filter:drop-shadow(4px 0 #e03ccf) drop-shadow(-4px 0 #2a0f63);border-color:#2a0f63}
.box.gl2{transform:translate(5px,-2px) skewX(-3deg);filter:drop-shadow(-4px 0 #e03ccf) drop-shadow(4px 0 #9a52ff)}
.box.gl .band{transform:translateX(10px);background:#2a0f63}.box.gl2 .band{transform:translateX(-12px)}
.box.gl .top{border-bottom-color:#9a52ff}.box.gl2 .by{transform:translateX(7px)}
.gt{font-family:"Major Mono Display",monospace;text-shadow:2px 0 #e03ccf,-2px 0 #2a0f63}
.small.gt,.by.gt{color:#9a52ff}
.desc.shake,.desc.shake2{border-color:#2a0f63}
.pg{font:700 12px/1.3 Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;border-top:3px solid #000;padding-top:8px}
/* ?stack: logo on top, the list underneath filling the rest of the height (the site's door, left column) */
html.stack,html.stack body{height:100%}
html.stack body{flex-direction:column;gap:10px;padding:0 6px 6px 0;box-sizing:border-box}
html.stack .box{width:auto}
html.stack .desc{width:auto;flex:1;min-height:0;font-size:14px}
html.stack .reel div{white-space:normal}
html.stack .reel .g{font-size:14px}
html.stack .pg{font-size:10px}
html.stack .P{font-size:min(150px,82vw)}html.stack .band{font-size:min(22px,14vw)}html.stack .small{font-size:min(13px,9vw)}

const box=document.querySelector('.box'),T={small:box.querySelector('.small'),band:box.querySelector('.band'),by:box.querySelector('.by')},TH={};for(const k in T)TH[k]=T[k].innerHTML;
const spud=document.querySelector('.spud'),logoTop=document.querySelector('.top'),reel=document.getElementById('reel'),win=document.querySelector('.win'),desc=document.querySelector('.desc');
const print=new URLSearchParams(location.search).has('print');if(new URLSearchParams(location.search).has('stack'))document.documentElement.classList.add('stack');
function add(){const d=document.createElement('div');d.textContent=next();reel.appendChild(d)}
if(print){PRINT.forEach(t=>{const d=document.createElement('div');d.textContent=t;reel.appendChild(d)});reel.style.position='static';win.style.webkitMaskImage=win.style.maskImage='none'}
else{
 const fill=()=>{let n=0;while(reel.lastElementChild&&reel.scrollHeight-y<win.clientHeight+120&&n++<60)add();if(!reel.children.length)add()};   // always enough lines to fill the box, however tall it gets
 add();
 const slow=matchMedia('(prefers-reduced-motion: reduce)').matches;let y=0,last=performance.now();fill();
 (function tick(t){const dt=Math.min(.1,(t-last)/1000);last=t;y+=dt*(slow?6:22);
  const first=reel.firstElementChild;if(first&&y>first.offsetHeight+6){y-=first.offsetHeight+6;first.remove()}fill();
  reel.style.transform='translateY('+(-y)+'px)';requestAnimationFrame(tick)})(last);
 // every so often POTATO GLITCHES IN, and that is what breaks everything else: he flickers into the P first, the
 // ripple spreads (box, bars, words, then the list), and when he flickers out it all snaps back. Everything random:
 // how long, how hard, which parts, the offsets, the spelling, the stutters (12 fps, his glitch rules).
 const R=(a,b)=>a+Math.random()*(b-a),ch=p=>Math.random()<p;
 const LEET={a:['4','@'],e:['3'],o:['0'],t:['7'],s:['5','$'],i:['1','!'],r:['r','R']};
 const leet=h=>h.split('<br>').map(line=>[...line].map(c=>{const l=LEET[c.toLowerCase()];let o=l&&ch(.55)?pick(l):c;
   o=ch(.5)?o.toLowerCase():o.toUpperCase();return ch(.08)?o+pick(['—','_','·']):o}).join('')).join('<br>');
 function reset(){logoTop.classList.remove('isp','isp2');box.style.transform=box.style.filter=box.style.borderColor='';
  desc.style.transform=desc.style.filter=desc.style.borderColor='';box.querySelector('.band').style.transform=box.querySelector('.band').style.background='';
  for(const k in T){T[k].innerHTML=TH[k];T[k].classList.remove('gt');T[k].style.transform=''}
  [...reel.querySelectorAll('.g')].forEach(r=>{r.classList.remove('g');r.textContent=r.dataset.old});}
 function frame(f,n,power){
  const inP=f<2||f>=n-2;                        // his flicker in (first frames) and out (last frames)
  logoTop.classList.remove('isp','isp2');if(inP?ch(.6):ch(.92))logoTop.classList.add(ch(.7)?'isp':'isp2');
  if(f<1)return;                                // he arrives first: nothing else breaks until he's there
  const spread=Math.min(1,f/3)*power*(f>=n-2?.4:1);
  const hit=k=>ch(spread*k);
  if(hit(.95)){box.style.transform=`translate(${R(-7,7)}px,${R(-3,3)}px) skewX(${R(-4,4)}deg)`;const d=R(2,6);
   box.style.filter=`drop-shadow(${d}px 0 #e03ccf) drop-shadow(${-d}px 0 ${pick(['#2a0f63','#9a52ff'])})`;box.style.borderColor=ch(.5)?pick(['#2a0f63','#9a52ff']):''}
  else{box.style.transform=box.style.filter=box.style.borderColor=''}
  const band=box.querySelector('.band');band.style.transform=hit(.8)?`translateX(${R(-16,16)}px)`:'';band.style.background=hit(.4)?'#2a0f63':'';
  for(const k in T){if(hit(.75)){T[k].innerHTML=leet(TH[k]);T[k].classList.add('gt');T[k].style.transform=`translateX(${R(-8,8)}px)`}
   else{T[k].innerHTML=TH[k];T[k].classList.remove('gt');T[k].style.transform=''}}
  if(f>=2&&hit(.7)){desc.style.transform=`translate(${R(-5,5)}px,${R(-2,2)}px)`;const d=R(2,5);desc.style.filter=`drop-shadow(${d}px 0 #e03ccf) drop-shadow(${-d}px 0 #2a0f63)`;desc.style.borderColor=ch(.5)?'#2a0f63':''}
  else{desc.style.transform=desc.style.filter=desc.style.borderColor=''}
  if(f>=2&&hit(.6)){const rows=[...reel.children].filter(r=>!r.classList.contains('g')&&r.offsetTop-y>0&&r.offsetTop-y<win.clientHeight-20);
   for(let j=0,m=1+(Math.random()*3|0);j<m&&rows.length;j++){const r=rows.splice(Math.random()*rows.length|0,1)[0];r.dataset.old=r.textContent;r.classList.add('g');r.textContent=pick(G)}}
 }
 function glitch(){spud.src=pick(SPUDS);const n=6+(Math.random()*10|0),power=R(.55,1);let f=0;
  (function step(){if(f>=n){reset();setTimeout(glitch,(slow?20000:4000)+Math.random()*9000);return}
   frame(f,n,power);f++;setTimeout(step,ch(.2)?83*(2+(Math.random()*3|0)):83)})()}   // stutter holds: some frames hang 2-4x
