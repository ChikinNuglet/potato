function bolt(g, t, x0, y0, x1, y1, seed, wdt = 6) { g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = '#ffffff'; g.shadowColor = PURPLE; g.shadowBlur = 24; g.lineWidth = wdt; g.beginPath(); g.moveTo(x0, y0); for (let k = 1; k <= 9; k++) { const u = k / 9; g.lineTo(x0 + (x1 - x0) * u + (k < 9 ? (R(seed + Math.floor(t * 30), k) - 0.5) * 60 : 0), y0 + (y1 - y0) * u + (k < 9 ? (R(seed + Math.floor(t * 30), k + 20) - 0.5) * 40 : 0)); } g.stroke(); g.restore(); }

// ---------- the boot (inside the reply, before the road) ----------
function bootLayer(g, t) {

}

const typed = (M, t) => M.text.slice(0, Math.floor(clamp((t - M.t0) / Math.max(0.3, M.t1 - M.t0 - 0.25)) * M.text.length));

    g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.roundRect(bx, 36, bw, 18, 9); g.fill(); g.fillStyle = t < COLL ? '#7dff6a' : MAG; g.beginPath(); g.roundRect(bx, 36, Math.max(18, bw * pr), 18, 9); g.fill();

  g.beginPath(); g.arc(xx, xy, 11, 0, 7); g.fillStyle = '#ff5f57'; g.fill(); g.strokeStyle = INK; g.lineWidth = 2; g.stroke(); g.strokeStyle = '#5a0a0a'; g.lineWidth = 3; g.beginPath(); g.moveTo(xx - 4, xy - 4); g.lineTo(xx + 4, xy + 4); g.moveTo(xx + 4, xy - 4); g.lineTo(xx - 4, xy + 4); g.stroke();

    const glitchy = sent.who === 'kevin' && span(t, KEV.glitch, KEV.land + 0.4); if (glitchy && t > KEV.zap) { g.restore(); } else {

    g.fillStyle = '#ffffff'; g.fillText(s, tx, BAR.y + 36); if (Math.floor(t * 3) % 2) g.fillRect(tx + g.measureText(s).width + 3, BAR.y + 22, 3, 28); }

}
function cursor(g, x, y) { g.save(); g.translate(x, y); g.fillStyle = '#ffffff'; g.strokeStyle = '#000'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 26); g.lineTo(7, 20); g.lineTo(12, 31); g.lineTo(17, 29); g.lineTo(12, 18); g.lineTo(21, 18); g.closePath(); g.fill(); g.stroke(); g.restore(); }

// ---------- one frame ----------
function frame(t) {
  o.setTransform(1, 0, 0, 1, 0, 0); o.globalAlpha = 1; o.filter = 'none'; o.fillStyle = '#000'; o.fillRect(0, 0, W, H);

window.MV = { frame, async stills(ts) { for (const t of ts) { frame(t); await fetch(`http://localhost:8798/save?name=run-${t.toFixed(2)}`, { method: 'POST', body: out.toDataURL('image/jpeg', 0.85) }); } return 'ok'; },
  async all(from = 0, to = END) { const n0 = Math.round(from * FPS), n1 = Math.round(to * FPS); for (let i = n0; i < n1; i++) { frame(i / FPS); await fetch(`http://localhost:8787/save?name=f${String(i).padStart(5, '0')}.jpg`, { method: 'POST', body: out.toDataURL('image/jpeg', 0.84) }); if (i % 48 === 0) log(`frame ${i} / ${n1}`); } return 'done'; } };
