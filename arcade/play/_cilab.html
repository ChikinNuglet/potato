<!doctype html>
<!-- Confidently Incorrect — PRETEND gameplay video (Chikin: "show me what it might look like as a game, just pretend, dont make a
     real game"). The lab: Kevin's house at night (the game's kitchen), Potato in the mad-scientist outfit (the Fitting Room's
     drawn Potato), fake experts stitched from Vega's CI stickers. Verses = BUILD (catch the scraps on the words, stitch them on),
     drops = IT'S ALIVE (the lever), choruses = RAMPAGE (ride it through the house, smash on the big hits). Scratch (play/_*). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Rubik+Mono+One&display=swap">
<style>body{margin:0;background:#111;color:#9f9;font:12px monospace} #out{width:960px;height:540px;display:block}</style>
<script>var module = { exports: {} }, exports = module.exports;</script>
<script src="https://cdn.jsdelivr.net/npm/perfect-freehand@1.2.3/dist/cjs/index.js"></script>
<script>window.PF = module.exports; module = undefined; exports = undefined;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/closet/glitchwords.js" charset="utf-8"></script>
<script src="/closet/potato-draw.js" charset="utf-8"></script>
<script src="/closet/outfits.js" charset="utf-8"></script>
<script src="/closet/potato-moves.js" charset="utf-8"></script>
</head><body><canvas id="out" width="1280" height="720"></canvas><div id="log"></div>
<script type="module">
const P = PotatoDraw, MV_ = PotatoMoves;
const W = 1280, H = 720, END = 248.45, FPS = 24, out = document.getElementById('out'), o = out.getContext('2d');
const log = m => { document.getElementById('log').textContent = m; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), ease = u => { u = clamp(u); return u * u * (3 - 2 * u); }, span = (t, a, b) => t >= a && t < b;
const R = (a, b = 0) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const INK = '#120a05', PURPLE = '#9a52ff', MAG = '#e03ccf', LILAC = '#c9a7ff', GREEN = '#7dff6a', BEAT = 60 / 101.3;
await document.fonts.load('400 20px "Major Mono Display"'); await document.fonts.load('400 40px "Rubik Mono One"');
const img = async src => { const i = new Image(); i.src = src; await i.decode(); return i; };
const TAPS = await fetch('./_citaps.json').then(r => r.json());
const STK = await fetch('../words/confidently-incorrect.stickers.json').then(r => r.json());
const WJ = await fetch('../words/confidently-incorrect.json').then(r => r.json());
const LINES = []; for (const r of WJ.timings) { if (r[0] == null) continue; let L = LINES[LINES.length - 1]; if (!L || L.id !== r[1]) LINES.push(L = { id: r[1], t0: r[0], words: [] }); L.words.push({ t: r[0], w: String(r[2]).replace(/\/$/, '') }); }
for (let i = 0; i < LINES.length; i++) LINES[i].t1 = i + 1 < LINES.length ? LINES[i + 1].t0 : LINES[i].words[LINES[i].words.length - 1].t + 2.5;
const ST = {}; for (const s of STK) if (!ST[s.key]) ST[s.key] = await img(`./stickers-ci2/${s.key}.webp`).catch(() => null);
for (const k of ['gary', 'stephanie', 'statistics', 'hot-pockets', 'cornelius', 'kevin', 'everest', 'taxonomy', 'station']) if (!ST[k]) ST[k] = await img(`./stickers-ci2/${k}.webp`).catch(() => null);
const KIT = await img('./_sbk/kitchen-10-lit.png'), HEAD = await img('./_cihead.png');

// ---------- the game, on the song ----------
// monsters: built in a BUILD stretch from the scraps sung in it, switched on at `alive` (the lever on the drop), named on `name`
const MON = [
  { key: 'gary', b0: 15.2, alive: 41.62, name: 48.32, label: 'DR. GARY M. BARRETT', rampage: [62.65, 97.83] },
  { key: 'stephanie', b0: 97.83, alive: 115.09, name: 117.1, label: 'STEPHANIE GOBLIN, PhD', rampage: [117.1, 140.57] },
  { key: 'statistics', b0: 150.23, alive: 159.53, name: 152.38, label: 'THE FABRICATOR', rampage: [159.53, 176.12] },
  { key: 'hot-pockets', b0: 176.12, alive: 186.17, name: 177.27, label: 'DR. H. POCKETS', rampage: [186.17, 193.0] },
  { key: 'everest', b0: 193.0, alive: 999, name: 193.81, label: 'EVEREST (A SANDWICH)', rampage: null },
  { key: 'cornelius', b0: 206.2, alive: 237.70, name: 234.72, label: 'DR. CORNELIUS BEEFWHISTLE III', rampage: null, mega: true },
];
const monAt = t => { let m = null; for (const x of MON) if (t >= x.b0) m = x; return m; };
const KEV = { walk: 145.52, ring: 147.09, zap: 148.27 }, STILL = [203.59, 206.2], MORNING = 241.25, PAPER = 246.6;
const scrapsOf = M => STK.filter(s => s.t >= M.b0 && s.t < Math.min(M.alive, M.b0 + 40) && ST[s.key] && s.key !== M.key);
const inRampage = t => MON.find(m => m.rampage && span(t, m.rampage[0], m.rampage[1]));
const mode = t => t < 2.56 ? 'question' : t < 15.2 ? 'boot' : t >= PAPER ? 'paper' : t >= MORNING ? 'morning' : span(t, 237.7, 241.25) ? 'blowout' : span(t, 140.57, 150.23) ? 'kevin' : inRampage(t) ? 'rampage' : 'lab';
// score: every tap he makes count (glitch +100, big +300, x combo)
const SCORE = []; { let s = 0, c = 0; for (const m of TAPS) { if (m.t < 2.56) continue; c = Math.min(8, c + 1); s += (m.kind === 'big' ? 300 : 100) * Math.ceil(c / 2); SCORE.push([m.t, s, c]); } }
const scoreAt = t => { let v = [0, 0, 0]; for (const x of SCORE) { if (x[0] > t) break; v = x; } return v; };
const FACES = [[0, 'smirk'], [10.17, 'laugh'], [15.2, 'thinking'], [24.4, 'smirk'], [41.62, 'scream'], [42.6, 'laugh'], [48.32, 'smirk'], [62.65, 'laugh'], [72.19, 'skeptical'], [74.29, 'angry'], [76.95, 'laugh'],
  [97.83, 'thinking'], [115.09, 'scream'], [116, 'laugh'], [124, 'smirk'], [140.6, 'happy'], [145.52, 'startled'], [147.09, 'question'], [148.27, 'wide'], [149.5, 'smirk'], [157.2, 'laugh'], [176.12, 'scream'],
  [186.17, 'laugh'], [193.0, 'thinking'], [203.59, 'canon'], [206.2, 'laugh'], [216, 'smirk'], [228.3, 'startled'], [233.75, 'thinking'], [237.7, 'scream'], [240.2, 'wide']];
const at = (L, t) => { let v = L[0][1]; for (const [a, x] of L) if (t >= a) v = x; return v; };
let curFace = 'canon', fromFace = 'canon', faceAt = -9;
function potato(g, t, x, y, h, yaw = 0.35, extra = {}) {
  const f = extra.face || at(FACES, t); if (f !== curFace) { fromFace = curFace; curFace = f; faceAt = t; }
  let p = P.mix(P.pose(fromFace), P.pose(curFace), ease((t - faceAt) / 0.25)); const idle = MV_.idle(t, 7);
  p.open = (p.open || [0.5, 0.5]).map(v => v * idle.blink);
  Object.assign(p, { x, y, h, squash: idle.squash * (extra.squash || 1), lean: idle.lean + (extra.lean || 0), yaw, costume: 'mad-scientist', fxT: t, arms: 'none' });
  g.save(); g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(x, y + 2, h * 0.42, h * 0.05, 0, 0, 7); g.fill(); g.restore(); P.draw(g, p); }

const kickEnv = t => { const b = (t - 0.148) / BEAT; return Math.exp(-(b - Math.floor(b)) * BEAT / 0.12); };

// ---------- the lab: his kitchen at night, wired up ----------
const SLAB = { x: 700, y: 560 };
function lab(g, t, wired = 0) {
  const KH = H * 1.08, KW = KH * 16 / 9; g.drawImage(KIT, (W - KW) / 2, H - KH, KW, KH);
  g.save(); g.globalCompositeOperation = 'multiply'; g.fillStyle = '#3a4a6a'; g.fillRect(0, 0, W, H); g.restore();   // night
  glow(g, SLAB.x, SLAB.y - 150, 520, GREEN, 0.18 + 0.1 * kickEnv(t));
  // cables from every corner of the house (the last build: the whole house wired in)
  if (wired > 0) { g.save(); g.lineWidth = 9; g.strokeStyle = INK; for (let i = 0; i < 14; i++) { const sx = R(i, 1) * W, sy = i % 3 ? 0 : R(i, 2) * H * 0.6, u = ease(wired * 1.3 - i * 0.06); if (u <= 0) continue;
      g.beginPath(); g.moveTo(sx, sy); g.quadraticCurveTo((sx + SLAB.x) / 2, SLAB.y - 60 + 120 * R(i, 3), sx + (SLAB.x - sx) * u, sy + (SLAB.y - 200 - sy) * u); g.stroke(); } g.restore(); }
  // the shelf of jars (one holds Kevin, from the zap on)
  g.fillStyle = '#3a2a1c'; g.fillRect(960, 230, 290, 14); g.strokeStyle = INK; g.lineWidth = 5; g.strokeRect(960, 230, 290, 14);
  for (let i = 0; i < 4; i++) jar(g, 990 + i * 68, 230, i === 3 && t >= KEV.zap + 1.0 ? (t >= MORNING ? 'empty' : 'kevin') : 'specimen', t, i);
  // the coils and the slab
  for (const cx of [SLAB.x - 300, SLAB.x + 300]) { g.fillStyle = '#5a5248'; g.fillRect(cx - 18, 380, 36, 200); g.strokeStyle = INK; g.lineWidth = 5; g.strokeRect(cx - 18, 380, 36, 200);
    for (let k = 0; k < 7; k++) { g.beginPath(); g.ellipse(cx, 395 + k * 24, 34, 9, 0, 0, 7); g.fillStyle = '#c87a3a'; g.fill(); g.stroke(); }
    g.beginPath(); g.arc(cx, 370, 22, 0, 7); g.fillStyle = '#d8d8e8'; g.fill(); g.stroke(); glow(g, cx, 370, 60, LILAC, 0.4 + 0.5 * kickEnv(t)); }
  g.fillStyle = '#6a6a72'; g.fillRect(SLAB.x - 200, SLAB.y, 400, 34); g.fillRect(SLAB.x - 170, SLAB.y + 34, 26, 120); g.fillRect(SLAB.x + 144, SLAB.y + 34, 26, 120); g.strokeStyle = INK; g.lineWidth = 6; g.strokeRect(SLAB.x - 200, SLAB.y, 400, 34);

  const L = MON.find(m => span(t, m.alive - 0.05, m.alive + 0.8)), pull = L ? ease((t - L.alive + 0.05) / 0.15) : 0;
  g.fillStyle = '#4a4a52'; g.fillRect(1120, 440, 70, 120); g.strokeStyle = INK; g.lineWidth = 5; g.strokeRect(1120, 440, 70, 120);
  g.save(); g.translate(1155, 470); g.rotate(-0.7 + 1.4 * pull); g.fillStyle = '#c0c0c8'; g.fillRect(-6, -90, 12, 90); g.strokeRect(-6, -90, 12, 90); g.beginPath(); g.arc(0, -92, 14, 0, 7); g.fillStyle = '#e03c3c'; g.fill(); g.stroke(); g.restore();
}
function jar(g, x, y, what, t, i) {
  g.save(); g.translate(x, y); g.fillStyle = what === 'kevin' ? 'rgba(154,82,255,.35)' : what === 'empty' ? 'rgba(200,220,255,.12)' : 'rgba(120,200,120,.3)'; g.beginPath(); g.roundRect(-26, -86, 52, 86, 10); g.fill();
  if (what === 'kevin' && ST.kevin) { g.drawImage(ST.kevin, -22, -80, 44, 44 * ST.kevin.naturalHeight / ST.kevin.naturalWidth); glow(g, 0, -40, 60, PURPLE, 0.5 + 0.3 * Math.sin(t * 3)); }
  if (what === 'specimen') { g.fillStyle = ['#7dff6a', '#ffcf5a', '#ff7ab0'][i % 3]; g.beginPath(); g.arc(0, -36, 13, 0, 7); g.fill(); }
  g.lineWidth = 5; g.strokeStyle = INK; g.beginPath(); g.roundRect(-26, -86, 52, 86, 10); g.stroke(); g.fillStyle = '#8a6a4a'; g.fillRect(-28, -96, 56, 12); g.strokeRect(-28, -96, 56, 12); g.restore(); }

// ---------- the monster: stitched patches, bolts, the fake expert's face on top, the scraps he caught pinned all over ----------
function monster(g, M, t, x, y, s, caught, lying = 0) {
  g.save(); g.translate(x, y); g.scale(s, s); if (lying) g.rotate(-lying * Math.PI / 2);
  const wob = M && t > M.alive ? Math.sin(t * 6) * 0.04 : 0; g.rotate(wob);
  // body
  const cols = ['#6b7a4a', '#8a8f7a', '#7a6a5a', '#5f6e58'];
  g.beginPath(); g.roundRect(-120, -260, 240, 260, 50); g.fillStyle = cols[0]; g.fill();
  g.save(); g.clip(); for (let i = 0; i < 6; i++) { g.fillStyle = cols[(i + 1) % 4]; g.beginPath(); g.moveTo(-140 + R(i, 4) * 280, -280); g.lineTo(-140 + R(i, 5) * 280, 10); g.lineTo(-140 + R(i, 6) * 280, 10); g.closePath(); g.fill(); }
  g.setLineDash([10, 8]); g.strokeStyle = PURPLE; g.lineWidth = 4; for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(-130, -220 + i * 60); g.quadraticCurveTo(0, -240 + i * 60 + 30 * R(i, 7), 130, -210 + i * 60); g.stroke(); } g.restore();
  g.beginPath(); g.roundRect(-120, -260, 240, 260, 50); g.lineWidth = 8; g.strokeStyle = INK; g.stroke();
  for (const sx of [-1, 1]) { g.fillStyle = '#c8ccd8'; g.fillRect(sx * 128 - 12, -180, 24, 30); g.strokeStyle = INK; g.lineWidth = 4; g.strokeRect(sx * 128 - 12, -180, 24, 30); }
  // feet
  g.fillStyle = '#3a3028'; for (const sx of [-1, 1]) { g.beginPath(); g.ellipse(sx * 60, 6, 50, 22, 0, 0, 7); g.fill(); g.lineWidth = 6; g.strokeStyle = INK; g.stroke(); }
  // the scraps he caught, pinned on
  caught.forEach((c, i) => { const im = ST[c.key]; if (!im) return; const cs = 90, cx = -80 + (i % 3) * 80, cy = -210 + Math.floor(i / 3) % 3 * 75; g.save(); g.translate(cx, cy); g.rotate((R(i, 8) - 0.5) * 0.5); g.drawImage(im, -cs / 2, -cs / 2, cs, cs * im.naturalHeight / im.naturalWidth); g.restore(); });
  // the expert's face (the head)
  const hd = M && ST[M.key]; if (hd) { const hs = 210; g.drawImage(hd, -hs / 2, -260 - hs * 0.9, hs, hs * hd.naturalHeight / hd.naturalWidth); }
  g.restore();
}

// ---------- the HUD (pretend game) ----------
function hud(g, t) {
  const [, sc, combo] = scoreAt(t), md = mode(t);
  g.save(); g.font = '400 22px "Rubik Mono One"'; g.textBaseline = 'top';
  g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.roundRect(20, 18, 300, 74, 14); g.fill();
  g.fillStyle = '#ffe14d'; g.fillText(String(sc).padStart(7, '0'), 36, 28); g.font = '400 16px "Rubik Mono One"'; g.fillStyle = combo > 3 ? MAG : '#ffffff'; g.fillText('COMBO x' + combo, 36, 60);
  const label = { boot: 'POWERING UP', lab: 'BUILD', rampage: 'RAMPAGE!', kevin: '???', blowout: 'IT\'S ALIVE', morning: '', question: '', paper: '' }[md];
  if (label) { g.font = '400 26px "Rubik Mono One"'; const w = g.measureText(label).width + 40; g.fillStyle = md === 'rampage' ? '#e03c3c' : md === 'kevin' ? PURPLE : '#2a6a3a'; g.beginPath(); g.roundRect(W - w - 24, 18, w, 52, 14); g.fill(); g.lineWidth = 5; g.strokeStyle = INK; g.stroke(); g.fillStyle = '#ffffff'; g.fillText(label, W - w - 4, 30); }
  // the monster meter: how much of it he's built
  const M = monAt(t); if (M && md === 'lab' && t < M.alive) { const sc2 = scrapsOf(M), n = sc2.filter(s => s.t <= t).length, k = sc2.length ? n / sc2.length : 0;
    g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.roundRect(W - 344, 80, 320, 34, 10); g.fill(); g.fillStyle = GREEN; g.fillRect(W - 336, 88, 304 * k, 18); g.font = '400 12px "Rubik Mono One"'; g.fillStyle = INK; g.fillText('MONSTER ' + Math.round(k * 100) + '%', W - 328, 91); }
  g.restore();
}
function rating(g, t, events) { for (const e of events) { const a = t - e.t; if (a < 0 || a > 0.5) continue; g.save(); g.globalAlpha = 1 - a / 0.5; g.font = '400 28px "Rubik Mono One"'; g.textAlign = 'center'; g.lineWidth = 7; g.strokeStyle = INK; const txt = e.big ? 'PERFECT!' : 'GOOD'; g.strokeText(txt, e.x, e.y - 50 * a); g.fillStyle = e.big ? '#ffe14d' : '#ffffff'; g.fillText(txt, e.x, e.y - 50 * a); g.restore(); } }
function keyCap(g, x, y, label, k = 1) { g.save(); g.globalAlpha = k; g.fillStyle = '#efe6cf'; g.beginPath(); g.roundRect(x - 50, y - 26, 100, 52, 10); g.fill(); g.lineWidth = 5; g.strokeStyle = INK; g.stroke(); g.fillStyle = INK; g.font = '400 18px "Rubik Mono One"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, x, y + 1); g.restore(); }
function lyric(g, t) { const L = LINES.find(l => t >= l.t0 - 0.05 && t < l.t1); if (!L) return; const said = L.words.filter(x => x.t <= t + 0.03).map(x => x.w).join(' '); if (!said) return;
  g.save(); g.font = '400 28px "Major Mono Display"'; g.textAlign = 'center'; g.lineJoin = 'round'; g.lineWidth = 8; g.strokeStyle = INK; g.strokeText(said.toLowerCase(), W / 2, H - 28, W - 80); g.fillStyle = said === said.toUpperCase() ? '#ffe14d' : '#fff4dc'; g.fillText(said.toLowerCase(), W / 2, H - 28, W - 80); g.restore(); }
function lightning(g, t, x0, y0, x1, y1, seed, wdt = 6) { g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = '#ffffff'; g.shadowColor = PURPLE; g.shadowBlur = 30; g.lineWidth = wdt; g.beginPath(); g.moveTo(x0, y0); for (let k = 1; k <= 8; k++) { const u = k / 8; g.lineTo(x0 + (x1 - x0) * u + (k < 8 ? (R(seed + Math.floor(t * 30), k) - 0.5) * 70 : 0), y0 + (y1 - y0) * u); } g.stroke(); g.restore(); }

// ---------- one frame ----------
function frame(t) {
  o.setTransform(1, 0, 0, 1, 0, 0); o.globalAlpha = 1; o.filter = 'none'; o.fillStyle = '#000'; o.fillRect(0, 0, W, H);
  const md = mode(t), M = monAt(t), ev = [];
  if (md === 'question') { o.fillStyle = '#05060c'; o.fillRect(0, 0, W, H); glow(o, W / 2, H / 2, 520, '#5f8cff', 0.3);
    const q = 'dear potato, what is the capital of niepal? thanks, kevin', n = Math.min(q.length, Math.floor(t / 2.3 * q.length));
    o.save(); o.translate(W / 2, H / 2); o.fillStyle = '#fff'; o.beginPath(); o.roundRect(-430, -42, 860, 84, 22); o.fill(); o.lineWidth = 6; o.strokeStyle = INK; o.stroke(); o.font = '400 24px "Major Mono Display"'; o.fillStyle = INK; o.textBaseline = 'middle'; o.fillText(q.slice(0, n) + (Math.floor(t * 4) % 2 ? '|' : ''), -400, 2); o.restore();
    if (t > 2.2) lightning(o, t, W / 2, 0, W / 2, H / 2 - 40, 3, 10); return; }
  if (md === 'paper') { const a = t - PAPER, hy = a < 0.35 ? -H + H * 1.5 * ease(a / 0.35) : H / 2, slam = t >= 247.304 ? 1 + 0.08 * Math.exp(-(t - 247.304) * 8) : 1; o.save(); o.translate(W / 2, hy); o.rotate(-0.025); o.scale(0.95 * slam, 0.95 * slam); o.drawImage(HEAD, -600, -380); o.restore(); return; }
  if (md === 'morning') { const KH = H * 1.08, KW = KH * 16 / 9; o.drawImage(KIT, (W - KW) / 2, H - KH, KW, KH); o.save(); o.globalCompositeOperation = 'soft-light'; o.fillStyle = '#ffe8c0'; o.fillRect(0, 0, W, H); o.restore();
    o.fillStyle = '#3a2a1c'; o.fillRect(960, 230, 290, 14); for (let i = 0; i < 4; i++) jar(o, 990 + i * 68, 230, i === 3 ? 'empty' : 'specimen', t, i);
    o.fillStyle = `rgba(0,0,0,${clamp((t - 245.6) / 0.9)})`; o.fillRect(0, 0, W, H); lyric(o, t); return; }
  if (md === 'rampage') { rampage(t, inRampage(t)); hud(o, t); lyric(o, t); return; }
  // ---- the lab (boot, build, alive, kevin, the last build, the blowout) ----
  const wired = t >= 206.2 ? clamp((t - 206.2) / 25) : 0; lab(o, t, wired);
  if (md === 'boot') { const on = ease((t - 2.56) / 1.2); o.fillStyle = `rgba(0,0,0,${0.7 * (1 - on)})`; o.fillRect(0, 0, W, H); if (span(t, 2.56, 3.0)) lightning(o, t, 400, 0, 400, 360, 1, 12), lightning(o, t, 1000, 0, 1000, 360, 2, 12);
    potato(o, t, 330, 600, 260, 0.35); keyCap(o, 330, 660, '← →  ↑  SPACE', clamp((t - 4) / 0.5) * clamp((14.5 - t) / 0.5)); }
  if (M && md !== 'boot') {
    const caught = scrapsOf(M).filter(s => s.t <= t), live = t >= M.alive;
    const mx = live && !M.mega ? SLAB.x + Math.sin(t * 2.2) * 60 : SLAB.x, my = live ? SLAB.y : SLAB.y, sz = M.mega ? 1.05 : 0.8, rise = live ? 0 : 1;
    if (!(md === 'kevin' && t > KEV.walk)) monster(o, M, t, mx, my - (rise ? 0 : 0), sz * (M.key === 'everest' ? 0.85 : 1), caught.slice(-9));
    // the scraps fly in on their words; a ring closes on the slab; catch = stitched on
    for (const s of scrapsOf(M)) { const a = t - (s.t - 0.7); if (a < 0 || a > 1.0 || !ST[s.key]) continue; const u = clamp(a / 0.7);
      if (u < 1) { const x = W + 100 - (W + 100 - SLAB.x) * ease(u), y = 140 + 300 * Math.sin(u * Math.PI) * -0.3 + 200 * u; o.drawImage(ST[s.key], x - 60, y - 60, 120, 120 * ST[s.key].naturalHeight / ST[s.key].naturalWidth);
        o.save(); o.strokeStyle = '#ffffff'; o.lineWidth = 5; o.globalAlpha = 0.8; o.beginPath(); o.arc(SLAB.x, SLAB.y - 140, 60 + 160 * (1 - u), 0, 7); o.stroke(); o.restore(); }
