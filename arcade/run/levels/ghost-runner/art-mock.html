<script>
// Ghost runner art mock-ups (code-drawn). Artist, Nov 4. Scenes: #run, #tip, #cast
const INK = '#120a05', WHITE = '#ffffff', PURP = ['#7b3cf2', '#9a52ff', '#e03ccf', '#c9a7ff'], VOID = '#12062e';
const OWN = {

  other: { name: '+41', c: '#6b7385', d: '#4c5363', ic: null },
};
const SEND = { james: { bg: '#2f8cff', fg: '#fff' }, sheila: { bg: '#e7e5ea', fg: '#1a1a1a' }, carol: { bg: '#e7e5ea', fg: '#1a1a1a' }, mum: { bg: '#e7e5ea', fg: '#1a1a1a' } };
const c = document.getElementById('c'), g = c.getContext('2d');
const hash = (a, b = 0) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
// sticker shape: white border, ink outline, fill
function sticker(x, y, w, h, r, fill, ink = 5, border = 5) {

function icon(kind, x, y, s) {

  if (kind === 'paw') { const pad = (r) => { g.beginPath(); g.ellipse(0, s * 0.12, s * 0.28 + r * 0.3, s * 0.22 + r * 0.3, 0, 0, 7); for (const [a, b] of [[-0.3, -0.2], [-0.1, -0.33], [0.1, -0.33], [0.3, -0.2]]) { g.moveTo(a * s + s * 0.1 + r * 0.3, b * s); g.ellipse(a * s, b * s, s * 0.09 + r * 0.3, s * 0.11 + r * 0.3, 0, 0, 7); } };
    g.fillStyle = WHITE; pad(s * 0.12); g.fill(); g.fillStyle = INK; pad(0); g.fill(); }

    g.fillStyle = WHITE; h(1.35); g.fill(); g.fillStyle = INK; h(1.12); g.fill(); g.fillStyle = '#ffd3cc'; h(0.85); g.fill(); }

    g.strokeStyle = '#ff5a4a'; g.lineWidth = s * 0.09; g.lineCap = 'round'; for (const ex of [-0.13, 0.13]) { g.beginPath(); g.moveTo(ex * s - s * 0.06, -s * 0.1); g.lineTo(ex * s + s * 0.06, s * 0.02); g.moveTo(ex * s + s * 0.06, -s * 0.1); g.lineTo(ex * s - s * 0.06, s * 0.02); g.stroke(); }
    g.strokeStyle = '#ddd'; g.lineWidth = s * 0.06; g.beginPath(); g.moveTo(-s * 0.12, s * 0.15); g.lineTo(s * 0.12, s * 0.15); g.stroke(); }
  if (kind === 'daisy') { for (const [r, col] of [[1.25, WHITE], [1.0, INK]]) { g.fillStyle = col; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; g.beginPath(); g.ellipse(Math.cos(a) * s * 0.2, Math.sin(a) * s * 0.2, s * 0.13 * r, s * 0.09 * r, a, 0, 7); g.fill(); } }
    g.fillStyle = '#fff6e0'; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; g.beginPath(); g.ellipse(Math.cos(a) * s * 0.2, Math.sin(a) * s * 0.2, s * 0.1, s * 0.06, a, 0, 7); g.fill(); }

// text bubble (sticker-ified: thin ink, no white border inside a screen). returns its rect
function bubble(x, y, w, h, who, text, opts = {}) {
  const S = SEND[who]; g.save();
  if (opts.rot) { g.translate(x + w / 2, y + h / 2); g.rotate(opts.rot); g.translate(-x - w / 2, -y - h / 2); }
  { const tx = who === 'james' ? x + w - 8 : x + 8, sg = who === 'james' ? 1 : -1;
    g.beginPath(); g.moveTo(tx - 8 * sg, y + h - 12); g.quadraticCurveTo(tx + 4 * sg, y + h, tx + 13 * sg, y + h + 4); g.quadraticCurveTo(tx + 1 * sg, y + h + 3, tx - 10 * sg, y + h - 2); g.closePath();
    g.fillStyle = S.bg; g.strokeStyle = INK; g.lineWidth = 2.5; g.lineJoin = 'round'; g.stroke(); g.fill(); }
  g.fillStyle = INK; rr(x - 2.5, y - 2.5, w + 5, h + 5, h / 2 + 2.5); g.fill();
  g.fillStyle = S.bg; rr(x, y, w, h, h / 2); g.fill();
  { const tx = who === 'james' ? x + w - 8 : x + 8, sg = who === 'james' ? 1 : -1; g.beginPath(); g.moveTo(tx - 8 * sg, y + h - 12); g.quadraticCurveTo(tx + 4 * sg, y + h, tx + 13 * sg, y + h + 4); g.quadraticCurveTo(tx + 1 * sg, y + h + 3, tx - 10 * sg, y + h - 2); g.closePath(); g.fillStyle = S.bg; g.fill(); }

  g.save(); rr(x, y, w, h, h / 2); g.clip(); g.fillStyle = 'rgba(0,0,0,0.10)'; g.fillRect(x, y + h * 0.72, w, h); g.restore();
  g.fillStyle = S.fg; g.font = `600 ${Math.round(h * 0.46)}px -apple-system, "Helvetica Neue", Arial`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, x + w / 2, y + h / 2 + 1);

    g.strokeStyle = PURP[0]; g.lineWidth = 3; rr(x - 5, y - 5, w + 10, h + 10, h / 2 + 5); g.stroke();
    const st = 5; for (let i = 0; i < 16; i++) { const t = hash(i, 3); const px = x + t * w, top = hash(i, 9) < 0.5; g.fillStyle = PURP[i % 4]; g.globalAlpha = 0.9; g.fillRect(Math.round(px / st) * st, (top ? y - 9 : y + h + 4) + (hash(i, 5) < 0.3 ? (top ? -st : st) : 0), st, st); } g.globalAlpha = 1; }
  if (opts.receipt) { g.fillStyle = '#9a9aa4'; g.font = '600 11px -apple-system, Arial'; g.textAlign = 'right'; g.fillText(opts.receipt, x + w, y + h + 13); }

}
function screenHeader(x, y, w, who) {
  const O = OWN[who]; g.fillStyle = '#efedf0'; g.fillRect(x, y, w, 34); g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(x, y + 33, w, 1.5);
  g.fillStyle = INK; g.beginPath(); g.arc(x + w / 2, y + 15, 11.5, 0, 7); g.fill(); g.fillStyle = O.c; g.beginPath(); g.arc(x + w / 2, y + 15, 9.5, 0, 7); g.fill();

  g.fillStyle = '#5a5a63'; g.font = '600 8px -apple-system, Arial'; g.fillText('group chat', x + w / 2, y + 30);

// a phone: cx, cy centre; w,h; rot (rad); owner; screen content cb(x,y,w,h) in the phone's upright frame
function phone(cx, cy, w, h, rot, who, content, opts = {}) {
  const O = OWN[who]; g.save(); g.translate(cx, cy); g.rotate(rot || 0); const x = -w / 2, y = -h / 2, R = w * 0.17;

  g.save(); rr(x, y, w, h, R); g.clip(); g.fillStyle = O.d; g.fillRect(x + w * 0.86, y, w, h); g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x + 6, y + R * 0.6, 4, h * 0.3); g.restore();

  g.fillStyle = INK; rr(sx - 3, sy - 3, sw + 6, sh + 6, sR + 3); g.fill();
  g.fillStyle = opts.dark ? '#141826' : '#fbfaf6'; rr(sx, sy, sw, sh, sR); g.fill();
  g.save(); rr(sx, sy, sw, sh, sR); g.clip();
  if (!opts.dark) { screenHeader(sx, sy + 8, sw, who); if (content) content(sx, sy + 46, sw, sh - 46); }
  else if (content) content(sx, sy, sw, sh);

  g.fillStyle = INK; rr(sx + sw / 2 - sw * 0.16, sy + 4, sw * 0.32, 9, 4.5); g.fill();
  g.restore();

  if (O.ic && !opts.noTag) { icon(O.ic, x + w - 4, y + 10, 26); }
  g.restore();
  if (!opts.noTag) tag(cx + Math.sin(rot || 0) * (h / 2 + 30), cy - Math.cos(rot || 0) * (h / 2 + 30), O.name, O.c, (rot || 0) * 0.3 - 0.06);

function tag(x, y, text, col, rot) {
  g.save(); g.translate(x, y); g.rotate(rot); g.font = '800 15px "Arial Rounded MT Bold", -apple-system, Arial'; const w = g.measureText(text).width + 20;
  sticker(-w / 2, -11, w, 22, 11, '#fff7ea', 3, 3); g.fillStyle = col; g.beginPath(); g.arc(-w / 2 + 10, 0, 4, 0, 7); g.fill();
  g.fillStyle = INK; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 5, 1); g.restore();

// a charger cable from the phone's port down into the dark (shows the rise/sink axis)
function cable(x, y, len, sway = 0) {
  g.save(); g.lineCap = 'round';
  const path = () => { g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + sway, y + len * 0.35, x - sway, y + len * 0.7, x + sway * 0.4, y + len); };

}
function bg() {
  const gr = g.createLinearGradient(0, 0, 0, 720); gr.addColorStop(0, '#0b0e1d'); gr.addColorStop(0.7, '#121833'); gr.addColorStop(1, '#0a0c18'); g.fillStyle = gr; g.fillRect(0, 0, 1280, 720);
  // wifi rings from the router on the horizon (faint, cold — not his purple)
  g.save(); g.strokeStyle = '#26305a'; g.lineWidth = 3; for (let i = 1; i < 7; i++) { g.globalAlpha = 0.5 - i * 0.06; g.beginPath(); g.arc(1080, 640, i * 95, Math.PI * 1.08, Math.PI * 1.92); g.stroke(); } g.restore();

  for (let i = 0; i < 26; i++) { const w = 26 + hash(i, 1) * 22, h = w * 2.05, x = i * 52 - 20 + hash(i, 2) * 20, y = 470 + hash(i, 3) * 120;
    g.fillStyle = '#1a2142'; rr(x, y, w, h, w * 0.18); g.fill(); g.fillStyle = hash(i, 4) < 0.6 ? '#2c3a6e' : '#1f2850'; rr(x + 3, y + 3, w - 6, h - 6, w * 0.13); g.fill();
    if (hash(i, 4) < 0.6) for (let k = 0; k < 3; k++) { g.fillStyle = k % 2 ? '#4a6bd0' : '#56607f'; g.globalAlpha = 0.6; rr(x + (k % 2 ? w * 0.4 : 6), y + 10 + k * 11, w * 0.45, 6, 3); g.fill(); g.globalAlpha = 1; } }
  // typing-dot stars
  g.fillStyle = '#3a4570'; for (let i = 0; i < 40; i++) { const x = hash(i, 7) * 1280, y = 70 + hash(i, 8) * 330; g.globalAlpha = 0.5; for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(x + k * 6, y, 1.6, 0, 7); g.fill(); } } g.globalAlpha = 1;
  // the router, far right on the horizon (green lights)
  g.fillStyle = '#0d1022'; rr(1040, 618, 80, 22, 6); g.fill(); for (let k = 0; k < 3; k++) { g.fillStyle = '#4dff9a'; g.globalAlpha = 0.8; g.beginPath(); g.arc(1062 + k * 14, 629, 2.5, 0, 7); g.fill(); } g.globalAlpha = 1;
  // the drop: fog at the bottom (no floor: the dark between messages)
  const f = g.createLinearGradient(0, 600, 0, 720); f.addColorStop(0, 'rgba(10,12,24,0)'); f.addColorStop(1, 'rgba(6,7,14,0.95)'); g.fillStyle = f; g.fillRect(0, 600, 1280, 120);
}
function lyric(text) { g.save(); g.font = '400 30px "Courier New", monospace'; g.textAlign = 'center'; g.fillStyle = '#efe3c8'; const sp = text.split('').join(String.fromCharCode(8202)); g.fillText(sp.toUpperCase(), 640, 62); g.restore(); }
function potato(x, y, h, pose = {}) { PotatoDraw.draw(g, Object.assign({ x, y, h, arms: 'none', look: [1, 0], open: [0.5, 0.5], mouth: { type: 'line', curve: -0.1, width: 0.6 } }, pose)); }
// his purple glitch round him (pixel blocks + a split)
function glitchAround(x, y, w, h, k = 1, seed = 1) {
  const st = 6; for (let i = 0; i < 40 * k; i++) { const px = x + (hash(i, seed) - 0.5) * w * 1.4, py = y - hash(i, seed + 1) * h * 1.1; g.fillStyle = i % 9 === 0 ? '#f3ecff' : PURP[i % 4]; g.globalAlpha = 0.85; g.fillRect(Math.round(px / st) * st, Math.round(py / st) * st, st * (1 + (i % 3 === 0)), st); }

function bolt(x0, y0, x1, y1, seed = 1) {
  const pts = [[x0, y0]]; const n = 7; for (let i = 1; i < n; i++) { const t = i / n; pts.push([x0 + (x1 - x0) * t + (hash(i, seed) - 0.5) * 16, y0 + (y1 - y0) * t + (hash(i, seed + 2) - 0.5) * 22]); } pts.push([x1, y1]);

function gword(text, x, y, rot = -0.08) { g.save(); g.translate(x, y); g.rotate(rot); g.font = '700 22px "Courier New", monospace'; g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.8)'; g.strokeText(text, 0, 0); g.fillStyle = '#e03ccf'; g.fillText(text, -2, 0); g.fillStyle = '#4dd2ff'; g.globalAlpha = 0.6; g.fillText(text, 2, 0); g.globalAlpha = 1; g.fillStyle = PURP[3]; g.fillText(text, 0, 0); g.restore(); }

// ================== SCENE 1: the run ==================

  // phone A (James) low left, he's just left it

  phone(820, 500, 150, 330, Math.PI / 2, 'carol', null, { noTag: true });
  // landscape content drawn upright over the sideways screen

    g.fillStyle = '#efedf0'; g.fillRect(x, y, 307.5, 24); g.fillStyle = INK; rr(x + 300 - 12, y + 40, 9, 46, 4.5); g.fill(); g.fillStyle = OWN.carol.c; g.beginPath(); g.arc(x + 150, y + 12, 7, 0, 7); g.fill();
    bubble(x + 16, y + 40, 150, 24, 'carol', 'robots. i SAID'); bubble(x + 126, y + 84, 150, 24, 'james', 'carol\'s right lol'); g.restore(); }

  potato(300, 300, 92, { arms: { L: { s: 1.6, e: 0.5, len: 0.7 }, R: { s: 1.9, e: 0.3, len: 0.7 } }, squash: 1.05, look: [1, -0.3], open: [0.62, 0.55], mouth: { type: 'o', open: 0.4, width: 0.5 } });

// ================== SCENE 2: the side-fall, 4 panels ==================
function sceneTip() {
  g.fillStyle = '#0d1021'; g.fillRect(0, 0, 1280, 720);
  const panels = [['1 · steady', 0], ['2 · wobble: 1 beat', 1], ['3 · tip on corner', 2], ['4 · land + rotate', 3]];
  panels.forEach(([label, k], i) => {
    const ox = i * 320; g.save(); g.beginPath(); g.rect(ox + 6, 6, 308, 708); g.clip();
    const gr = g.createLinearGradient(0, 0, 0, 720); gr.addColorStop(0, '#0b0e1d'); gr.addColorStop(1, '#151b38'); g.fillStyle = gr; g.fillRect(ox, 0, 320, 720);
    g.fillStyle = '#efe3c8'; g.font = '700 17px "Courier New", monospace'; g.textAlign = 'left'; g.fillText(label, ox + 18, 40);

    const content = (x, y, w) => { bubble(x + 8, y + 8, w * 0.72, 22, 'sheila', 'do you even'); bubble(x + w - w * 0.62 - 8, y + 50, w * 0.62, 22, 'james', 'i didn\'t!', { glitchable: k < 2 }); bubble(x + 8, y + 100, w * 0.66, 22, 'sheila', 'saturday?'); };
    if (k === 0) { cable(px, base + 2, 120, 10); phone(px, base - ph / 2, pw, ph, 0, 'sheila', content); potato(px - 16, base - ph + pw * 0.075 + 46 + 100 - 2, 50, { look: [1, 0] }); }
    if (k === 1) { const r = -0.06; cable(px, base + 2, 120, 10);
      phone(px, base - ph / 2, pw, ph, r, 'sheila', content);

      glitchAround(px + pw / 2 + 4, base, 24, 70, 0.7, 31); glitchAround(px + pw / 2 + 4, base - 120, 18, 50, 0.4, 37); bolt(px + pw / 2 + 8, base - 10, px + pw / 2 + 18, base - 110, 8);
      gword('t1p?', px + 40, base - ph - 40, 0.05);
      potato(px - 18, base - ph + pw * 0.075 + 46 + 100 - 4, 50, { look: [0.4, -0.5], open: [0.8, 0.8], tilt: -0.06, mouth: { type: 'line', curve: -0.2, width: 0.5 } }); }
    if (k === 2) { const r = 0.78, pvx = px + pw / 2, pvy = base;
