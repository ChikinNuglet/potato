<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>garden review</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html{background:#05070a}body{margin:0;color:#eef2f6;font:15px/1.5 "JetBrains Mono",monospace;display:flex;flex-direction:column;align-items:center;padding:20px 16px 60px}
.top{color:#8a93a6;font-size:13px;margin-bottom:10px}.card{width:min(560px,94vw);background:#0b0e14;border-radius:16px;padding:20px;box-shadow:0 0 0 1px #ffffff18}
canvas{display:block;margin:0 auto;width:260px;height:300px}.nm{font:700 24px "JetBrains Mono",monospace;text-align:center;margin:8px 0 2px}
.st{text-align:center;font-size:12px;letter-spacing:.12em;margin-bottom:10px}.lw{color:#c9a7ff;font-style:italic;text-align:center}.ct{background:#05070a;border-radius:10px;padding:10px 12px;color:#cfd6e4;margin:10px 0;font-size:13px}
label{display:block;color:#8a93a6;font-size:12px;margin:10px 0 4px}select,input[type=range]{width:100%}select{background:#05070a;color:#eef2f6;border:0;border-radius:8px;padding:10px;font:600 14px "JetBrains Mono",monospace;box-shadow:inset 0 0 0 1px #ffffff22}
.row{display:flex;gap:10px;margin-top:16px}.row button{flex:1;border:0;border-radius:12px;padding:16px 10px;font:700 16px "JetBrains Mono",monospace;cursor:pointer}
.ok{background:#4dff9a;color:#03140a}.fix{background:#ffd36b;color:#2a1a00}.nav{background:#1b2130;color:#eef2f6}
.ex{margin-top:24px;width:min(560px,94vw)}.ex textarea{width:100%;height:90px;background:#05070a;color:#8a93a6;border:0;border-radius:10px;padding:10px;font:12px monospace}
</style></head><body>
<div class="top" id="count"></div>
<div class="card"><canvas id="cv" width="520" height="600"></canvas><div class="nm" id="nm"></div><div class="st" id="st"></div><p class="lw" id="lw"></p>
 <div class="ct" id="ct"></div>
 <label>outfit</label><select id="body"></select><label>hat (from)</label><select id="hat"></select><label>hat line (raise or lower if the hat looks clipped)</label><input type="range" id="cut" min="30" max="60" value="46">
 <div class="row"><button class="nav" id="prev">←</button><button class="fix" id="bad">needs work</button><button class="ok" id="good">approve</button><button class="nav" id="next">→</button></div></div>
<div class="ex"><label>when you're done: copy this and send it to Claude</label><textarea id="out" readonly></textarea></div>
<script src="look.js"></script>
<script>
var AG=[],LOOKS={},OUT=[],i=0,st={};try{st=JSON.parse(localStorage.getItem('garden-review')||'{}')}catch(e){}
function save(){try{localStorage.setItem('garden-review',JSON.stringify(st))}catch(e){}var ok=Object.keys(st).filter(function(k){return st[k].ok===true}).length,bad=Object.keys(st).filter(function(k){return st[k].ok===false}).length;
 document.getElementById('count').textContent=(i+1)+' of '+AG.length+' · '+ok+' approved · '+bad+' need work';document.getElementById('out').value=JSON.stringify(st)}
function look(a){var s=st[a.name]||{},L=LOOKS[a.name]||{};return {body:s.body||L.body||'suit-tie',hat:s.hat!==undefined?s.hat:L.hat,cut:(s.cut||46)/100}}
function show(){var a=AG[i],lk=look(a),s=st[a.name]||{};document.getElementById('nm').textContent=a.name;document.getElementById('lw').textContent='“'+a.words+'”';
 document.getElementById('ct').textContent=(LOOKS[a.name]&&LOOKS[a.name].costume)?'asked for: '+LOOKS[a.name].costume:'asked for: (nothing recorded, the look is picked at random)';
 var t=document.getElementById('st');t.textContent=s.ok===true?'APPROVED':s.ok===false?'NEEDS WORK':'NOT REVIEWED';t.style.color=s.ok===true?'#4dff9a':s.ok===false?'#ffd36b':'#8a93a6';
 document.getElementById('body').value=lk.body;document.getElementById('hat').value=lk.hat||'';document.getElementById('cut').value=Math.round(lk.cut*100);LOOK.draw(document.getElementById('cv'),lk);save()}
function set(k,v){var n=AG[i].name;st[n]=st[n]||{};st[n][k]=v;show()}
document.getElementById('body').onchange=function(e){set('body',e.target.value)};document.getElementById('hat').onchange=function(e){set('hat',e.target.value||null)};document.getElementById('cut').oninput=function(e){set('cut',+e.target.value)};
document.getElementById('good').onclick=function(){set('ok',true);if(i<AG.length-1){i++;show()}};document.getElementById('bad').onclick=function(){set('ok',false);if(i<AG.length-1){i++;show()}};
document.getElementById('prev').onclick=function(){if(i>0){i--;show()}};document.getElementById('next').onclick=function(){if(i<AG.length-1){i++;show()}};
addEventListener('keydown',function(e){if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});
Promise.all([fetch('agents.json').then(function(r){return r.json()}),fetch('looks.json').then(function(r){return r.json()}),fetch('costumes/list.txt').then(function(r){return r.text()})]).then(function(v){
 var seen={};AG=v[0].filter(function(a){if(seen[a.name])return false;return seen[a.name]=1});LOOKS=v[1];OUT=v[2].trim().split('\n');
 var b=document.getElementById('body'),h=document.getElementById('hat');h.innerHTML='<option value="">no hat</option>';OUT.forEach(function(n){b.add(new Option(n,n));h.add(new Option(n,n))});show()});
</script></body></html>
