<!-- Nov 20, later: "with the text right, the potato project, and his orb, maybe the o in project is the orb", then the orb moved to the
     LAST O of potato, then the words: "its not his text" / "glitch text, it is always, always potato text". So the words are HIS TEXT, done the
     way his app does it (game/potato-app/index.html say()): Major Mono Display, the 1.5px magenta/green split, each letter scrambles in through
     junk characters, then capitals and small letters keep flipping while you read (in his font they are different shapes), and now and then
     the line tears. Then: "potato project is its own tm, not potato tm, we can add a disclaimer later": the ™ belongs to "potato project" as a whole, after it (a disclaimer comes later). Then "is the potato project better or project potato" -> Claude: project potato (a codename; the orb ends the line) -> "let it be so": PROJECT POTATO™. The last O of potato is the orb itself. -->
<style>
:root{--paper:#f3e7c9;--magenta:#e03ccf;--green:#4dff9a;--glitch:#9a52ff;--lilac:#c9a7ff}
html,body{margin:0;height:100%;background:#05070a;overflow:hidden}
canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;height:100dvh}
h1{position:fixed;inset:0;margin:0;display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:0 .45em;padding:0 16px;box-sizing:border-box;
  font:400 clamp(30px,8.5vw,104px)/1.15 "Major Mono Display",ui-monospace,monospace;color:var(--paper);text-align:center;
  text-shadow:1.5px 0 var(--magenta),-1.5px 0 var(--green),0 0 10px #000;pointer-events:none}
h1 .w{white-space:nowrap}
h1 .tm{font:600 .26em/1 ui-monospace,Menlo,monospace;vertical-align:1.1em;margin-left:.08em;opacity:.85}
h1 .o{display:inline-block;width:1em;margin-left:-.08em;color:transparent;text-shadow:none}   /* the orb's seat */
h1.tear{animation:tear .33s steps(4) 1}
h1.glitch{transform:translateX(3px) skewX(-5deg);color:var(--lilac)}
@keyframes tear{0%{clip-path:inset(0 0 60% 0);transform:translateX(9px)}25%{clip-path:inset(40% 0 0 0);transform:translateX(-12px)}50%{clip-path:inset(20% 0 30% 0);transform:translateX(5px);color:var(--glitch)}100%{clip-path:none;transform:none}}
@media (prefers-reduced-motion:reduce){h1.tear{animation:none}}
</style></head><body>
<canvas id="orb"></canvas>
<h1 id="name" aria-label="project potato, trademark"><span class="w"><span class="t" data-t="project"></span></span> <span class="w"><span class="t" data-t="potat"></span><span class="o" id="seat">o</span><span class="tm">™</span></span></h1>
<script src="orb.js"></script>
<script>
(function () {
  var cv = document.getElementById('orb'), seat = document.getElementById('seat'), h = document.getElementById('name'), orb = null, d = 1;
  var JUNK = '01#%@/_?!:~^', still = matchMedia('(prefers-reduced-motion: reduce)').matches, sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var parts = [].slice.call(h.querySelectorAll('.t'));
  parts.forEach(function (el) { el.textContent = el.dataset.t; });   // full width first, so the orb's seat is where it will stay
  function place() { d = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d);
    var r = seat.getBoundingClientRect(), fs = parseFloat(getComputedStyle(seat).fontSize);
    var P = { cx: (r.left + r.width * 0.42) * d, cy: (r.top + r.height * 0.64) * d, R: fs * 0.68 * d }; if (orb) orb.setPlace(P); return P; }
  async function scramble() {   // each letter scrambles in (his app's say())
    for (var p = 0; p < parts.length; p++) { var el = parts[p], t = el.dataset.t; el.textContent = '';
      for (var i = 1; i <= t.length; i++) { el.textContent = t.slice(0, i - 1) + JUNK[Math.floor(Math.random() * JUNK.length)]; await sleep(40); el.textContent = t.slice(0, i); await sleep(30); } } }
  // his glitch letters (the old door's set): a few letters swap, hold, snap back; sometimes the whole word goes glitch
  var GL = { a: '@4', e: '3', i: '1!', o: '0', s: '5$', t: '7', u: 'ü', p: 'þ', c: '(', h: '#', r: '®', n: 'ñ', d: 'Ð', j: 'ʝ' }, WHOLE = { project: 'pr0j3c7', potat: 'p0t@7' };
  parts.forEach(function (el) { el.dataset.cur = el.dataset.t; });
  function show(el) { if (!el.dataset.hold) el.textContent = el.dataset.cur; }
  function morph() {   // his lettering keeps changing shape: capitals and small letters flip while you read
    var el = parts[Math.floor(Math.random() * parts.length)], t = el.dataset.cur.split(''), i = Math.floor(Math.random() * t.length), c = t[i];
    if (c && /[a-z]/i.test(c)) t[i] = c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase(); el.dataset.cur = t.join(''); show(el); }
  function swap(el) { var whole = Math.random() < 0.25, g = whole ? WHOLE[el.dataset.t] : el.dataset.cur.split('').map(function (ch) { var k = GL[ch.toLowerCase()]; return k && Math.random() < 0.35 ? k[Math.floor(Math.random() * k.length)] : ch; }).join('');
    el.dataset.hold = 1; el.textContent = g; if (whole) h.classList.add('glitch');
    setTimeout(function () { delete el.dataset.hold; h.classList.remove('glitch'); show(el); }, 90 + Math.random() * 180);
    setTimeout(function () { swap(el); }, 500 + Math.random() * 1800); }
  function tear() { h.classList.remove('tear'); void h.offsetWidth; h.classList.add('tear'); if (orb) orb.glitch(0.7, 0.4); setTimeout(tear, 2500 + Math.random() * 5000); }
  function start() { var P = place();
    try { orb = window.PotatoOrb.createOrb(cv, { bg: '#05070a', cx: P.cx, cy: P.cy, R: P.R, words: window.POTATO_GLITCH_WORDS, idleGlitch: true }); } catch (e) { console.error('the orb would not start', e); }
    window.ORB = orb; addEventListener('resize', place);
    if (still) return; scramble().then(function () { setInterval(morph, 140); parts.forEach(function (el, k) { setTimeout(function () { swap(el); }, 400 + k * 700); }); setTimeout(tear, 1500); }); }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
})();
</script>
