<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>/*TITLE*/</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">   <!-- nothing on this page can load from another site or send anything out: no outside font, no network calls; pictures only from this same folder's host -->
<!-- Built by tools/potatocode_room.py. A proof of concept (Chikin, Nov 12 2026: "can we encrypt thursday potato" / "as proof of concept").
     Everything below the key slot is one locked file. The page holds no key. The locks are the browser's own (WebCrypto: PBKDF2, AES-256-GCM).
     Nobody outside has reviewed this build, so this page never calls itself secure. -->
<style>
:root{--bg:#030604;--plate:#0c1f14;--plate2:#12062e;--line:#12301f;--ink:#120a05;--text:#e8f5ec;--muted:#7fa48c;--warm:#ffd9a0;--soil:#5c3a18;--green:#2bff88;--bits:#4dff9a;
--glitch:#9a52ff;--magenta:#e03ccf;--deep:#2a0f63;--lilac:#c9a7ff;--his:"Major Mono Display",ui-monospace,monospace;--body:"Inter",system-ui,sans-serif;--split:2px 0 var(--magenta),-2px 0 var(--deep);--ring:0 0 0 2px var(--line);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:400 17px/1.55 var(--body);padding:28px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
h1{font:400 clamp(1.7rem,8vw,2.6rem)/1.05 var(--his);color:var(--warm);text-shadow:var(--split);margin:0}
h2{font:400 1.2rem/1.2 var(--his);color:var(--warm);margin:0 0 10px}
p{margin:0 0 12px}.small{font-size:.86rem;color:var(--muted)}a{color:var(--bits)}
.plate{background:var(--plate);border:3px solid var(--ink);border-radius:9px 13px 8px 12px;box-shadow:var(--ring),4px 5px 0 2px var(--ink);padding:18px 16px}
#door{position:relative;margin:0 auto;width:150px;height:190px;background:#101812;border:5px solid var(--ink);border-radius:14px 14px 6px 6px;box-shadow:var(--ring);overflow:hidden}
#door::after{content:"";position:absolute;right:16px;top:52%;width:9px;height:9px;border-radius:50%;background:var(--warm)}
#door i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--warm);transition:height .3s steps(3)}
#door.lit i{height:7px}
#door.open{background:var(--soil);transform:perspective(400px) rotateY(-28deg);transform-origin:left center;transition:transform .4s steps(4)}
form{display:grid;gap:12px}
label{font:400 .8rem var(--his);color:var(--muted)}
input{width:100%;font:700 1.05rem/1 var(--body);letter-spacing:.06em;color:var(--text);background:var(--bg);border:3px solid var(--ink);border-radius:8px 12px 9px 11px;padding:14px;box-shadow:var(--ring);text-transform:uppercase}
input::placeholder{color:var(--line)}
.key{height:56px;font:400 1.05rem/1 var(--his);color:var(--lilac);background:var(--plate2);border:3px solid var(--glitch);border-radius:9px 7px 10px 6px;box-shadow:-3px 0 0 var(--deep),3px 0 0 var(--magenta),0 5px 0 2px var(--ink);cursor:pointer;transition:transform 80ms steps(2)}
.key:active{transform:translateY(4px)}.key[disabled]{color:var(--line);border-color:var(--line);box-shadow:var(--ring);cursor:default}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
#say{min-height:1.4em;font:400 .95rem var(--his);color:var(--bits);margin:0}
#say.no{color:var(--magenta)}
#room{display:none}#room.on{display:block}
@media (prefers-reduced-motion:reduce){#door,#door i,.key{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>/*H1*/</h1>
  </header>
  <div id="door" aria-hidden="true"><i></i></div>
  <section class="plate" id="lock">
    <p>This room is one locked file. It was locked with Potatocode, and this page does not hold the key.</p>
    <form id="f" novalidate>
      <label for="k">yOur key</label>
      <input id="k" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-describedby="say">
      <button class="key" id="go" type="submit">Open</button>
      <p id="say" role="status"></p>
    </form>
    <p class="small" style="margin-top:8px">/*HINT*/</p>
  </section>
  <section class="plate" id="room" aria-live="polite"></section>
  <p class="small">A proof of concept. The locks are standard ones built into your browser. Our build has not been reviewed by an outside expert, so we do not call it secure.</p>
</div>
<script>
const ROOM=/*ROOM*/null;
const enc=new TextEncoder(),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),cat=(a,b)=>{const o=new Uint8Array(a.length+b.length);o.set(a);o.set(b,a.length);return o};
const sha=async(alg,u8)=>new Uint8Array(await crypto.subtle.digest(alg,u8));
// the same number stream the builder uses: SHA-256(seed + counter), four bytes at a time
function stream(seed){let n=0,buf=new Uint8Array(0);
  const u32=async()=>{if(buf.length<4){const c=new Uint8Array(4);new DataView(c.buffer).setUint32(0,n++);buf=cat(buf,await sha('SHA-256',cat(seed,c)))}const v=new DataView(buf.buffer,buf.byteOffset,4).getUint32(0);buf=buf.slice(4);return v};
  const below=async m=>{const lim=Math.floor(4294967296/m)*m;for(;;){const x=await u32();if(x<lim)return x%m}};
  return{async shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=await below(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}}}
const norm=k=>k.toUpperCase().replace(/[^A-Z0-9]/g,'');
async function arrangement(words,key){const k=enc.encode(norm(key));
  // the sheet as it starts: every square numbered left to right as one line (the spaces between words are squares too)
  const byword=[],spaces=[];let n=0;
  words.forEach((w,wi)=>{byword[wi]=Array.from(w).map(ch=>[ch,++n]);if(wi<words.length-1)spaces.push(++n)});
  // the words move, whole
  const order=await stream(await sha('SHA-256',cat(enc.encode('potatocode-room/words|'),k))).shuffle(words.map((_,i)=>i));
  const cells=[];let sp=0;order.forEach((wi,pos)=>{for(const c of byword[wi])cells.push([c[0],c[1]]);if(pos<order.length-1)cells.push([' ',spaces[sp++]])});
  // the twins trade places: the sheet reads the same, the numbers underneath move
  const st=stream(await sha('SHA-256',cat(enc.encode('potatocode-room/twins|'),k))),where=new Map();
  cells.forEach((c,i)=>{if(c[0]!==' '){if(!where.has(c[0]))where.set(c[0],[]);where.get(c[0]).push(i)}});
  for(const ch of [...where.keys()].sort((a,b)=>a.codePointAt(0)-b.codePointAt(0))){const idx=where.get(ch);if(idx.length<2)continue;
    const nums=await st.shuffle(idx.map(i=>cells[i][1]));idx.forEach((i,j)=>{cells[i][1]=nums[j]})}
  return cells.map(c=>c[1]).join(' ')}
async function unlock(key){
  const line=await arrangement(ROOM.words,key),mat=await sha('SHA-512',enc.encode(line));
  const base=await crypto.subtle.importKey('raw',mat,'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ROOM.salt),iterations:ROOM.rounds,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ROOM.iv),additionalData:enc.encode('potatocode-room-v1')},k,b64(ROOM.blob));
  return new TextDecoder().decode(plain)}
const f=document.getElementById('f'),say=document.getElementById('say'),go=document.getElementById('go'),door=document.getElementById('door');
f.addEventListener('submit',async e=>{e.preventDefault();const v=document.getElementById('k').value;
  if(!norm(v).length)return;   /* a blank door: every wrong answer gets the same reply after the same wait, whatever its length or shape */
  go.disabled=true;say.className='';say.textContent='ArrAnging the sheet…';door.classList.remove('lit');
  try{const html=await unlock(v);door.classList.add('lit');say.textContent='0pen.';
    setTimeout(()=>{door.classList.add('open');document.getElementById('lock').style.display='none';const r=document.getElementById('room');r.innerHTML=html;r.classList.add('on')},500)}
  catch(err){go.disabled=false;say.className='no';say.textContent=(window.crypto&&crypto.subtle)?'n0pe. the rOOm stAys shut.':'this brOwser cAnnOt Open lOcks here.'}});
</script>
</body>
