<!doctype html>
<!-- Confidently Incorrect video plates: the level's cardboard-space painter rendered as short loops, the 3D Potato in his
     astronaut suit in poses, and the next-morning headline. Posts PNG/JPEG to a local receiver. Scratch tool (play/_* is not published). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Rubik+Mono+One&family=Bungee&display=swap">
<style>body{margin:0;background:#111;color:#9f9;font:12px monospace} #sp{position:absolute;left:-2000px;top:0;width:512px;height:512px}</style>
</head><body><canvas id="c" width="960" height="540"></canvas><div id="sp"></div><div id="log"></div>
<script type="module">
import { meta, parseWords } from '../run/levels/confidently-incorrect.mjs';
import { story } from '../run/levels/story-confidently-incorrect.mjs';
import { makeMusic } from './music.mjs';
import { createSpud } from './_sbspud.mjs';
import { loadOutfit } from './outfits3d.mjs';
import * as T from './vendor/three.module.js';
const W = 960, H = 540, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const log = m => { document.getElementById('log').textContent = m; };
const music = await fetch('./' + meta.map.replace('.map.json', '.music.json')).then(r => r.json()); const M = makeMusic(music);
await document.fonts.load('400 20px "Major Mono Display"'); await document.fonts.load('400 40px "Rubik Mono One"');
const post = (name, url) => fetch(`http://localhost:8794/save?name=${name}`, { method: 'POST', body: url });

// the backdrop: the level's own painter, as a short loop from t0
async function plate(name, t0, n = 12, fps = 8) {
  for (let i = 0; i < n; i++) { const t = t0 + i / fps; ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    story(ctx, { t, px: W * 0.3, py: H * 0.55, music: M, kick: 0, W, H, s: { x: t * 7, y: 2.5, shots: [], t } }); await post(`${name}-${String(i).padStart(2, '0')}.jpg`, cv.toDataURL('image/jpeg', 0.8)); } }

// Potato in the astronaut suit (the level's costume), one pose per face
const host = document.getElementById('sp'), spud = await createSpud(host, { still: true }), pcv = host.querySelector('canvas');
const suit = await loadOutfit('orbital-astronaut'); spud.wear(suit);
async function faceTex(n) { const img = new Image(); img.src = n === 'canon' ? './face-canon.png' : `./faces/face-${n}.png`; await img.decode();
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0); const tx = new T.CanvasTexture(c); tx.colorSpace = T.NoColorSpace; return tx; }
async function pose(face, yaw = 0.35, glitch = 0, name = null) {
  spud.setFace(await faceTex(face)); spud.snap(yaw); spud.glitch(glitch); for (let k = 0; k < 40; k++) spud.step(k / 60, 1 / 60);
  await post(`pot-${name || face}.png`, pcv.toDataURL('image/png')); }

// the next morning's paper
async function headline() {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 760; const x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.beginPath(); x.roundRect(10, 10, 1180, 740, 26); x.fill();
  x.fillStyle = '#120a05'; x.beginPath(); x.roundRect(22, 22, 1156, 716, 20); x.fill();
  x.fillStyle = '#f1ead6'; x.beginPath(); x.roundRect(30, 30, 1140, 700, 16); x.fill();
  x.fillStyle = '#120a05'; x.font = '400 54px "Rubik Mono One"'; x.textAlign = 'center'; x.fillText('THE MORNING EDITION', 600, 104);
  x.fillRect(60, 124, 1080, 6); x.fillRect(60, 136, 1080, 2);
  x.font = '400 64px "Rubik Mono One"'; x.fillText('LOCAL BOY, KEVIN,', 600, 228); x.fillText('MISSING.', 600, 306);
  x.font = '400 30px "Rubik Mono One"'; x.fillText('FAMILY SAYS A.I. AGENT IS RESPONSIBLE', 600, 368);
  x.fillRect(60, 392, 1080, 2);
  const k = new Image(); k.src = './stickers-ci2/kevin.webp'; await k.decode(); x.save(); x.filter = 'grayscale(1) contrast(1.1)'; x.fillStyle = '#d8d0bc'; x.fillRect(80, 418, 300, 280); x.drawImage(k, 95, 428, 270, 270 * k.naturalHeight / k.naturalWidth); x.restore();
  x.lineWidth = 4; x.strokeStyle = '#120a05'; x.strokeRect(80, 418, 300, 280);
  x.fillStyle = '#7a705c'; for (let r = 0; r < 9; r++) for (let col = 0; col < 2; col++) { const X = 420 + col * 370, Y = 430 + r * 30, w = 330 - (r === 8 ? 140 : (r * 37 % 60)); x.fillRect(X, Y, w, 9); }
  await post('headline.png', c.toDataURL('image/png')); }

window.CI = { plate, pose, headline, async all() {
  for (const [n, t] of [['opener', -3], ['liftoff', 3.0], ['space1', 17], ['space2', 31], ['spaghetti', 54], ['sun', 66], ['sun2', 81], ['belt', 104], ['belt2', 128],
    ['kevin', 147], ['fire', 158], ['wild', 182], ['everest', 196], ['still', 203.6], ['hyper', 213], ['hyper2', 236], ['end', 246]]) { await plate(n, t); log(n); }
  for (const f of ['canon', 'smirk', 'grin', 'laugh', 'joy', 'shock', 'proud', 'question', 'angry', 'sneaky', 'determined', 'oh', 'skeptical', 'scream']) await pose(f).catch(() => null);
  await pose('smirk', 0.35, 1, 'glitch'); await pose('laugh', -0.35, 0, 'laugh-l'); await pose('canon', 0.0, 0, 'front');
  await headline(); return 'done'; } };
window.__ready = true; log('ready');
</script></body></html>
