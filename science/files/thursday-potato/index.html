function label() { count.textContent = Math.max(0, at + 1) + '/' + B.length; const nx = B[at + 1]; const q = nx && nx.t === 'say' && nx.who === 'Unknown';
  nextB.textContent = at >= B.length - 1 ? 'end' : q ? 'send' : '▸'; nextB.disabled = at >= B.length - 1; prompt(q ? nx.lines.join(' ') : ''); try { localStorage.setItem('ch1-at', String(at)); } catch (e) {} }
function glitchTo(fn) { busy = true; orbGlitch(1, .5); stream.classList.add('tear'); flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');

  if (typingNode) { typingNode.dataset.skip = '1'; return; }

  const nx = B[at + 1]; if (b.t === 'say' && b.who === 'Unknown' && nx && !(nx.t === 'say' && nx.who === 'Unknown')) (function go() { if (busy || typingNode) return setTimeout(go, 120); setTimeout(next, 450); })();
}

nextB.addEventListener('click', e => { e.stopPropagation(); next(); });
stream.addEventListener('click', next);

cover(); label();
